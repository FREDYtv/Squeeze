<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<title>Сжатие — фото и видео</title>
<style>
:root{
  --bg:#f5f5f3;--surface:#fff;--surface-2:#efefec;--text:#161616;--muted:#6e6e69;--line:#e4e4df;
  --accent:#3b5bff;--accent-soft:rgba(59,91,255,.1);--good:#168a56;--bad:#d24545;--warn:#b7791f;
  --radius:20px;--radius-sm:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d0d0f;--surface:#161618;--surface-2:#1f1f23;--text:#f1f1ef;--muted:#8d8d93;--line:#2a2a2f;
  --accent:#7c92ff;--accent-soft:rgba(124,146,255,.14);--good:#4cc790;--bad:#ff7070;--warn:#e0a84a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip;overscroll-behavior-y:contain}
*{-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:clip;overflow-wrap:anywhere}
body{overscroll-behavior-y:contain}
body.lock{overflow:hidden;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;max-width:100%}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* ===== каркас ===== */
.app{width:100%;max-width:1240px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none}
.brand h1{font-size:19px;letter-spacing:-.02em;line-height:1.15}
.brand p{font-size:12.5px;color:var(--muted);display:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0;align-content:start}
.side{display:block;min-width:0}

/* ===== кнопки ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:background .15s,transform .1s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.88}
.btn.stop{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:36px;height:36px;border-radius:11px;border:0;background:transparent;color:var(--muted)}
.icon-btn.sm:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm svg{width:17px;height:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus:not(:focus-visible),summary:focus:not(:focus-visible),label:focus:not(:focus-visible),[role=checkbox]:focus:not(:focus-visible),.cmp:focus:not(:focus-visible){outline:none}
button,summary,label,.chip,.segb{-webkit-user-select:none;user-select:none}
@media(hover:none){:focus-visible,.cmp:focus-visible{outline:none}}

/* ===== загрузка ===== */
.drop{display:grid;justify-items:center;gap:10px;text-align:center;padding:36px 18px;border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-ic{width:56px;height:56px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center}
.drop strong{font-size:18px;letter-spacing:-.01em}
.drop-sub{font-size:14px;color:var(--muted);max-width:40ch}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:4px}
.pill{font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.drop.compact{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;text-align:left}
.drop.compact .drop-ic{width:38px;height:38px;border-radius:12px}
.drop.compact .drop-ic svg{width:20px!important;height:20px!important}
.drop.compact strong{font-size:15px}
.drop.compact .drop-sub,.drop.compact .pills{display:none}

/* ===== сводка ===== */
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px 10px 16px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line)}
.summary .txt{font-size:14px;min-width:0}
.summary .acts{display:flex;gap:8px;flex-wrap:wrap}
.save{font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.save.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.save.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

.loadbar{flex-basis:100%;display:grid;gap:6px;padding:2px 4px 4px 0}
.loadbar .lt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.loadbar .bar i{transition:width .2s}
.cmp{cursor:ew-resize;touch-action:none}
.cmp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== панель выбора ===== */
.selbar{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:25;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:7px 7px 7px 12px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:var(--shadow)}
.cbrow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:42px;border:0;background:none;padding:0;text-align:left;border-radius:10px}
.cbtxt{display:grid;min-width:0;line-height:1.25}
.cbtxt b{font-size:14px;white-space:nowrap}
.cbtxt small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s;color:#fff}
.cb svg{width:14px;height:14px;stroke-width:3.2}
.cbrow[aria-checked=true] .cb,.cbrow[aria-checked=mixed] .cb{background:var(--accent);border-color:var(--accent)}
.selbar .btn{flex:none;padding:0 16px}

/* ===== карточки файлов ===== */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);animation:in .25s ease;min-width:0;overflow:hidden;transition:border-color .15s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px}
.card.eligible .crow{cursor:pointer}
.card.open{border-color:var(--accent)}
.thumb{position:relative;width:52px;height:52px;border-radius:13px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.thumb.ready img{opacity:1}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);opacity:.55}
.thumb .ph svg{width:22px;height:22px}
.thumb.ready .ph{display:none}
.card[data-status=loading] .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--text) 9%,transparent) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.badge{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;display:none}
.selbox{position:absolute;inset:0;border:0;background:transparent;padding:0;cursor:pointer;border-radius:13px}
.selbox .cb{position:absolute;top:5px;left:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid #fff;color:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.selbox[aria-checked=true] .cb{background:var(--accent);border-color:#fff}
.selbox .cb svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4}
.card.picked .thumb{box-shadow:0 0 0 2px var(--text)}
.body{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start}
.head{display:flex;align-items:center;gap:4px;justify-content:space-between;min-width:0}
.name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.hbtns{display:flex;gap:0;margin:-5px -8px -5px 0;flex:none}
.card.open [data-act=toggle]{background:var(--accent-soft);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.tag{font-size:11.5px;color:var(--muted);padding:1px 8px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.tag.kind{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tag.own{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);font-weight:600}
.plan{font-size:13px;color:var(--muted);min-width:0}
.plan b{color:var(--text)}
.plan .err{color:var(--bad)}
.plan .stale{color:var(--warn);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ind i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions:empty{display:none}
.actions.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:440px}
.actions.grid .btn{width:100%;padding:0 8px;min-width:0}
.actions.grid>.btn:last-child:nth-child(odd){grid-column:1/-1}
.card[data-status=done] .thumb{cursor:pointer}
.xwrap{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s cubic-bezier(.22,.8,.24,1),visibility 0s linear .4s}
.card.open .xwrap{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.xclip{min-height:0;overflow:hidden}
.xpanel{border-top:1px solid var(--line);padding:14px 14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface));opacity:0;transform:translateY(-8px);transition:opacity .3s ease .04s,transform .4s cubic-bezier(.22,.8,.24,1)}
.card.open .xpanel{opacity:1;transform:none}
.xhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.xstate{font-size:13px;color:var(--muted);flex:1;min-width:160px}
.xstate b{color:var(--good)}
.xbtns{display:flex;gap:8px;flex-wrap:wrap}
.xest{min-height:42px;font-size:13px;color:var(--muted);padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.xest b{color:var(--text)}

/* ===== настройки ===== */
.settings{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.mix{padding:10px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--text)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.group>summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.group>summary::-webkit-details-marker{display:none}
.gi{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.gt{flex:1;min-width:0;display:grid;line-height:1.25}
.gt b{font-size:16px}
.gt small{color:var(--muted);font-size:12.5px}
.chev{color:var(--muted);transition:transform .2s}
.group[open]>summary>.chev{transform:rotate(180deg)}
.gbody{padding:2px 16px 16px}
.fbody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:grid;gap:1px;min-width:0;min-height:54px;padding:9px 13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:.15s}
.chip b{font-size:14px;line-height:1.25}
.chip small{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--surface-2)}
.chips>.chip:last-child:nth-child(odd){grid-column:1/-1}
.tbtns{display:flex;gap:8px;flex:none}
.ver{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);line-height:1.5;transform:translateY(-1px)}
.ver:hover{color:var(--text);background:var(--surface-2)}
.sg{padding:2px 16px 18px;display:grid;gap:10px;align-content:start}
.sg-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -2px}
.sg-r{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sg>*{min-width:0;max-width:100%}
.sg-r>span:first-child{display:grid;gap:2px;font-size:14.5px;min-width:0;flex:1 1 100%}
.sg-r.switchrow>span:first-child{flex:1 1 0}
.sg small,.pmain small{font-size:12px;color:var(--muted);font-weight:400}
.seg{display:flex;gap:3px;padding:3px;border-radius:13px;background:var(--surface-2);flex:1 1 100%;min-width:0}
.segb{flex:1 1 0;min-width:0;height:36px;padding:0 6px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;color:var(--muted)}
.segb.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding-right:4px}
.pmain{flex:1;min-width:0;display:grid;gap:1px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:14px}
.pmain:hover{background:var(--surface-2)}
.pmain b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg-about{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.notes{padding-left:20px;display:grid;gap:7px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on small{color:rgba(255,255,255,.85)}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lbl output{color:var(--text);font-variant-numeric:tabular-nums;font-size:14px}
.ctl{height:46px;width:100%;min-width:0;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;text-align:left}
.ctl:focus,.ctl:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.sel:hover{background:var(--surface-2)}
.sel .sv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sel svg{color:var(--muted);width:16px;height:16px}
.num{display:flex;align-items:center;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.num button{width:44px;height:100%;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);flex:none}
.num button:hover{background:var(--surface-2);color:var(--text)}
.num input{flex:1;min-width:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:16px;outline:none;font-variant-numeric:tabular-nums}
.num .nu{color:var(--muted);font-size:13px;flex:none;padding-right:4px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ctl.txt{padding:0 14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer;--fill:50%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--accent) var(--fill),var(--line) var(--fill))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft),0 1px 4px rgba(0,0,0,.25)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2:has(>[hidden])>:not([hidden]){grid-column:1/-1}
.row2:not(:has(>:not([hidden]))){display:none}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.switchrow .t{font-size:14px}
.switch{position:relative;width:48px;height:29px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(19px)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.hint.warn{color:var(--bad)}
.more>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;padding:6px 0}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"+";display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:var(--surface-2);line-height:1}
.more[open]>summary::before{content:"−"}
.mbody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:8px}
.common{padding:4px 16px 6px}

/* ===== панель запуска ===== */
.runbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.run-info{flex:1;min-width:0;display:grid;line-height:1.3}
.run-info b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-info span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-info span b{color:var(--text);font-size:inherit}

.cmp .after{clip-path:inset(0 0 0 var(--p))}
.cmp .div{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.cmp .div::after{content:"⇆";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cmp-range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.lab{position:absolute;top:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.lab.l{left:10px}.lab.r{right:10px}
.player{display:grid;gap:10px}
.player video{width:100%;max-height:64dvh;border-radius:16px;background:#000;display:block;cursor:pointer}
.pctl{display:flex;align-items:center;gap:10px}
.pctl .icon-btn{width:40px;height:40px}
.pctl input[type=range]{flex:1;min-width:0}
.ptime{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);animation:fade .18s}

@keyframes up{from{transform:translateY(40px);opacity:.4}}

.grab{width:100%;height:22px;margin:0;background:none;position:relative;flex:none}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;min-height:54px;border:0;background:transparent;border-radius:14px}

.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:640px){

}

<script>
(()=>{

/* ---------- настройки ---------- */
const DEFAULTS={
  img:{mode:'auto',prio:'balance',acodec:'avif',format:'webp',sharpen:true,quality:78,resMode:'maxside',maxSide:2560,percent:70,cw:1920,ch:1080,target:false,targetKb:500,bg:'#ffffff'},

]};

const IMG_PRESETS=[

];

/* ---------- возможности браузера ---------- */
const UA=navigator.userAgent;
const IS_SAFARI=/iP(hone|ad|od)/.test(UA)||(/safari/i.test(UA)&&!/chrome|chromium|crios|fxios|edg|android/i.test(UA));
const MAXPX=IS_SAFARI?16000000:130000000; // лимит площади canvas
const CAN_WEBP=(()=>{try{return document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')}catch(e){return false}})();
const vFormats=(()=>{
  if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream)return[];
  const C=[['video/mp4;codecs=avc1.640028,mp4a.40.2','MP4 · H.264','mp4'],['video/mp4;codecs=avc1.42E01E,mp4a.40.2','MP4 · H.264','mp4'],['video/mp4','MP4','mp4'],
    ['video/webm;codecs=vp9,opus','WebM · VP9','webm'],['video/webm;codecs=av1,opus','WebM · AV1','webm'],['video/webm;codecs=vp8,opus','WebM · VP8','webm'],['video/webm','WebM','webm']];
  const out=[];let mp4=false,webm=false;
  for(const [m,l,e] of C){
    let ok=false;try{ok=MediaRecorder.isTypeSupported(m)}catch(x){}
    if(!ok)continue;
    if(e==='mp4'){if(mp4)continue;mp4=true}
    else if(m==='video/webm'){if(webm)continue}
    else webm=true;
    out.push({mime:m,label:l,ext:e});
  }
  return out;
})();

/* ---------- утилиты ---------- */
function fmtBytes(b){
  if(!isFinite(b))return'—';
  const u=['Б','КБ','МБ','ГБ'];let i=0;
  while(b>=1024&&i<3){b/=1024;i++}
  return nf(b,i===0?0:b>=100?0:b>=10?1:2)+' '+u[i];
}
function fmtDur(s){
  if(!isFinite(s)||s<=0)return'—';
  s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');
  return h?`${h}:${p(m)}:${p(c)}`:`${m}:${p(c)}`;
}
const baseName=n=>{const i=n.lastIndexOf('.');return i>0?n.slice(0,i):n};
const safeSuffix=()=>String(settings.common.suffix||'').replace(/[\\/:*?"<>|]/g,'');
const find=id=>state.items.find(i=>i.id===Number(id));
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- уведомления ---------- */
function toast(msg,type='info'){
  const t=el('div','toast '+type,`<span class="ti">${type==='success'?I.check:type==='error'?I.alert:I.info}</span><span>${esc(msg)}</span>`);
  const box=$('#toasts');box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  let gone=false;
  const kill=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>t.remove(),220)};
  t.addEventListener('click',kill);
  setTimeout(kill,type==='error'?6000:3400);
}

/* ---------- свои выпадающие списки и диалоги ---------- */
const ov=$('#ov'),sheet=$('#sheet');
let sheetResolve=null;
function syncLock(){document.body.classList.toggle('lock',!ov.hidden||!$('#modal').hidden)}
function openSheet(fill){
  if(sheetResolve)closeSheet(null);
  return new Promise(res=>{
    sheetResolve=res;sheet._settings=false;sheet._opts=null;sheet.style.transform='';sheet.style.transition='';ov.style.background='';fill(sheet);ov.hidden=false;syncLock();
    const on=$('.opt.on',sheet);if(on)on.scrollIntoView({block:'center'});
    const f=$('.opt.on,.opt,[data-ok]',sheet);if(f)f.focus({preventScroll:true});
  });
}
function closeSheet(v){
  ov.hidden=true;sheet.innerHTML='';syncLock();
  const r=sheetResolve;sheetResolve=null;r&&r(v);
}
function pick({title,options,value}){
  return openSheet(s=>{
    s.innerHTML=`<div class="grab"></div><div class="sheet-head"><b>${esc(title)}</b><button class="icon-btn sm" data-close aria-label="Закрыть">${I.x}</button></div>
    <div class="sheet-list" role="listbox">${options.map((o,i)=>`<button type="button" class="opt${String(o[0])===String(value)?' on':''}" role="option" data-i="${i}"><span class="ot"><span>${esc(o[1])}</span>${o[2]?`<small>${esc(o[2])}</small>`:''}</span><span class="ck">${I.check}</span></button>`).join('')}</div>`;
    s._opts=options;
  });
}
function askConfirm({title,text,ok,danger}){
  return openSheet(s=>{
    s._opts=null;
    s.innerHTML=`<div class="grab"></div><div class="dlg"><b>${esc(title)}</b><p>${esc(text)}</p><div class="dbtns"><button type="button" class="btn" data-close>Отмена</button><button type="button" class="btn ${danger?'stop':'primary'}" data-ok>${esc(ok)}</button></div></div>`;
  }).then(v=>v==='ok');
}
(function sheetSwipe(){
  const desk=matchMedia('(min-width:640px)');
  let y0=0,dy=0,t0=0,armed=false,drag=false,list=null;
  sheet.addEventListener('touchstart',e=>{
    armed=false;drag=false;
    if(e.touches.length!==1||desk.matches||/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
    list=e.target.closest('.sheet-list');
    armed=!list||list.scrollTop<=0;
    y0=e.touches[0].clientY;dy=0;t0=Date.now();
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(!armed)return;
    const d=e.touches[0].clientY-y0;
    if(!drag){
      if(d<-6){armed=false;return}
      if(d<8)return;
      if(list&&list.scrollTop>0){armed=false;return}
      drag=true;sheet.style.transition='none';
    }
    dy=Math.max(0,d);
    sheet.style.transform=`translateY(${dy}px)`;
    ov.style.background=`rgba(0,0,0,${Math.max(0,.45*(1-dy/Math.max(1,sheet.offsetHeight)))})`;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  const end=()=>{
    if(!drag){armed=false;return}
    const fast=dy/Math.max(1,Date.now()-t0)>.6;
    drag=false;armed=false;
    if(dy>100||fast){
      sheet.style.transition='transform .2s ease-out';sheet.style.transform='translateY(110%)';ov.style.background='rgba(0,0,0,0)';
      setTimeout(()=>closeSheet(null),190);
    }else{
      sheet.style.transition='transform .2s ease-out';sheet.style.transform='';ov.style.background='';
    }
  };
  sheet.addEventListener('touchend',end);sheet.addEventListener('touchcancel',end);
})();
ov.addEventListener('click',e=>{
  if(e.target===ov)return closeSheet(null);
  if(e.target.closest('[data-close]'))return closeSheet(null);
  if(e.target.closest('[data-ok]'))return closeSheet('ok');
  const o=e.target.closest('.opt');
  if(o&&sheet._opts)closeSheet(sheet._opts[Number(o.dataset.i)][0]);
});

function buildForm(kind,ctx,isGlobal){
  const specs=FIELDS[kind](isGlobal),root=el('div','fbody'),parts=[];
  let row=null,more=null;
  const setVal=(k,v)=>{if(ctx.get()[k]!==v)ctx.change({[k]:v})};

  const makers={
    chips(s){
      const box=el('div','chips');
      s.presets.forEach(p=>{const b=el('button','chip',`<b>${esc(p.n)}</b><small>${esc(p.d)}</small>`);b.type='button';b.onclick=()=>ctx.change(p.v);b._p=p;box.appendChild(b)});
      return{el:box,sync(o){$$('.chip',box).forEach(b=>b.classList.toggle('on',Object.entries(b._p.v).every(([k,v])=>String(o[k])===String(v))))}};
    },
    select(s){
      const f=el('div','field',`<div class="lbl">${esc(s.label)}</div>`);
      const b=el('button','ctl sel',`<span class="sv"></span>${I.chev}`);b.type='button';f.appendChild(b);
      const opts=()=>typeof s.opts==='function'?s.opts():s.opts;
      b.onclick=async()=>{
        const v=await pick({title:s.label,options:opts(),value:ctx.get()[s.k]});
        if(v!==null&&v!==undefined)setVal(s.k,v);
      };
      return{el:f,sync(o){const x=opts().find(a=>String(a[0])===String(o[s.k]));$('.sv',b).textContent=x?x[1]:String(o[s.k]);b.disabled=s.k==='format'&&kind==='video'&&!vFormats.length}};
    },
    range(s){
      const f=el('div','field',`<div class="lbl">${esc(s.label)}<output></output></div><input type="range" min="${s.min}" max="${s.max}" step="1" aria-label="${esc(s.label)}">`);
      const inp=$('input',f),out=$('output',f);
      inp.addEventListener('input',()=>setVal(s.k,Number(inp.value)));
      return{el:f,sync(o){const v=Number(o[s.k]);if(Number(inp.value)!==v)inp.value=v;out.textContent=v+(s.suf||'');inp.style.setProperty('--fill',((v-s.min)/(s.max-s.min)*100)+'%')}};
    },
    num(s){
      const f=el('div','field',`<div class="lbl">${esc(s.label)}</div><div class="num"><button type="button" data-d="-1" aria-label="Меньше">−</button><input type="text" inputmode="${s.dec?'decimal':'numeric'}" autocomplete="off" placeholder="${s.empty?'без лимита':''}" aria-label="${esc(s.label)}"><span class="nu">${esc(s.unit||'')}</span><button type="button" data-d="1" aria-label="Больше">+</button></div>`);
      const inp=$('input',f),step=s.step||1;
      const parse=()=>{const t=inp.value.replace(',','.').trim();if(t==='')return s.empty?'':null;const n=Number(t);return Number.isFinite(n)?n:null};
      const norm=n=>n===''?'':Math.round(clamp(n,s.min,s.max)*100)/100;
      const show=o=>{inp.value=o[s.k]===''||o[s.k]==null?'':String(o[s.k]).replace('.',',')};
      inp.addEventListener('input',()=>{const n=parse();if(n===null)return;if(n!==''&&(n<s.min||n>s.max))return;setVal(s.k,n)});
      inp.addEventListener('blur',()=>{const n=parse();if(n!==null)setVal(s.k,norm(n));show(ctx.get())});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});
      $$('button',f).forEach(b=>b.addEventListener('click',()=>{
        const cur=ctx.get()[s.k],base=cur===''||cur==null?(s.start||s.min):Number(cur);
        setVal(s.k,norm(base+Number(b.dataset.d)*step));
      }));
      return{el:f,sync(o){if(document.activeElement!==inp)show(o)}};
    },
    switch(s){
      const f=el('div','field',`<label class="switchrow"><span class="t">${esc(s.label)}</span><span class="switch"><input type="checkbox"><span></span></span></label>`);
      const inp=$('input',f);inp.addEventListener('change',()=>setVal(s.k,inp.checked));
      return{el:f,sync(o){inp.checked=!!o[s.k]}};
    },
    swatch(s){
      const f=el('div','field',`<div class="lbl">${esc(s.label)}</div><div class="swatches"></div>`);
      const box=$('.swatches',f);
      s.colors.forEach(([c,n])=>{const b=el('button','sw');b.type='button';b.style.background=c;b.setAttribute('aria-label',n);b.dataset.c=c;b.onclick=()=>setVal(s.k,c);box.appendChild(b)});
      return{el:f,sync(o){$$('.sw',box).forEach(b=>b.classList.toggle('on',b.dataset.c===o[s.k]))}};
    },
    hint(s){return{el:el('div','hint'+(s.warn?' warn':''),esc(s.text)),sync(){}}}
  };

  specs.forEach(s=>{
    const part=makers[s.t](s),inner=part.sync;
    part.sync=o=>{part.el.hidden=s.show?!s.show(o):false;inner(o)};
    parts.push(part);
    let host=root;
    if(s.more){
      if(!more){more=el('details','more','<summary>Дополнительно</summary><div class="mbody"></div>');root.appendChild(more)}
      host=$('.mbody',more);
    }
    if(s.half){
      if(!row||row.parentNode!==host){row=el('div','row2');host.appendChild(row)}
      row.appendChild(part.el);
    }else{row=null;host.appendChild(part.el)}
  });
  return{root,sync(){const o=ctx.get();parts.forEach(p=>p.sync(o))}};
}

/* ---------- планирование ---------- */
function imagePlan(d,s){
  const {w,h}=d;let k=1;
  if(s.resMode==='maxside'){const m=Number(s.maxSide);k=m>0?Math.min(1,m/Math.max(w,h)):1}
  else if(s.resMode==='percent')k=Math.min(1,num(s.percent,100)/100);
  else if(s.resMode==='custom'){
    const cw=Number(s.cw)>0?Number(s.cw):Infinity,ch=Number(s.ch)>0?Number(s.ch):Infinity;
    k=Math.min(1,cw/w,ch/h);
  }
  return capPlan({w:Math.max(1,Math.round(w*k)),h:Math.max(1,Math.round(h*k)),k});
}
function capPlan(p){
  const a=p.w*p.h;if(a<=MAXPX)return p;
  const f=Math.sqrt(MAXPX/a);
  return{w:Math.max(1,Math.floor(p.w*f)),h:Math.max(1,Math.floor(p.h*f)),k:p.k*f};
}
function outFormat(it,s){
  let m=s.format;
  if(m==='auto')m='webp';
  if(m==='orig'){
    const t=((it.file.type||'')+' '+it.name).toLowerCase();
    m=t.includes('png')?'png':t.includes('webp')?'webp':(t.includes('jpeg')||t.includes('jpg'))?'jpeg':(CAN_WEBP?'webp':'jpeg');
  }
  if(m==='webp'&&!CAN_WEBP&&!usesWasm(s))m='jpeg';
  return{jpeg:{mime:'image/jpeg',ext:'jpg',label:'JPEG'},mozjpeg:{mime:'image/jpeg',ext:'jpg',label:'JPEG (MozJPEG)'},avif:{mime:'image/avif',ext:'avif',label:'AVIF'},webp:{mime:'image/webp',ext:'webp',label:'WebP'},png:{mime:'image/png',ext:'png',label:'PNG'}}[m];
}
function videoPlan(it,s){
  const {w,h}=it;let k=1;
  if(s.resMode==='custom')k=Math.min(1,num(s.customSide,1280)/Math.max(w,h));
  else if(s.resMode!=='original')k=Math.min(1,Number(s.resMode)/Math.min(w,h));
  const W=even(w*k),H=even(h*k);
  const fpsArg=s.fps==='orig'?0:Number(s.fps);
  const fps=fpsArg||30;
  const dur=isFinite(it.duration)&&it.duration>0?it.duration:0;
  const abps=s.audio==='keep'?num(s.abr,128)*1000:0;
  const origBps=dur?it.size*8/dur:0;
  let vbps;
  if(s.qmode==='bitrate')vbps=num(s.mbps,3)*1e6;
  else if(s.qmode==='size'&&dur)vbps=num(s.targetMb,20)*1048576*8/dur/1.03-abps;
  else{
    const bpp={high:0.1,medium:0.06,low:0.035,min:0.02}[s.preset]||0.06;
    vbps=W*H*fps*bpp;
    if(origBps)vbps=Math.min(vbps,Math.max(origBps*0.9-abps,100e3));
  }
  vbps=clamp(vbps,100e3,60e6);
  const est=dur?(vbps+abps)*dur/8*1.03:NaN;
  return{w:W,h:H,fpsArg,vbps,abps,est};
}

/* ---------- чтение метаданных (лёгкое: без полной декодировки в памяти) ---------- */
function loadImg(url){
  return new Promise((res,rej)=>{
    const img=new Image();img.decoding='async';
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('Формат не поддерживается браузером'));
    img.src=url;
  });
}
async function readImage(it){
  const img=await loadImg(it.url);
  it.w=img.naturalWidth;it.h=img.naturalHeight;
  if(!it.w||!it.h)throw new Error('Не удалось определить размер изображения');
  const k=Math.min(1,200/Math.max(it.w,it.h)),tw=Math.max(1,Math.round(it.w*k)),th=Math.max(1,Math.round(it.h*k));
  let c=null;
  try{
    c=mkCanvas(tw,th);
    let drawn=false;
    if(typeof createImageBitmap==='function'){
      try{
        const bmp=await createImageBitmap(it.file,{resizeWidth:tw,resizeHeight:th,resizeQuality:'medium'});
        c.getContext('2d').drawImage(bmp,0,0,tw,th);bmp.close&&bmp.close();drawn=true;
      }catch(e){}
    }
    if(!drawn)c.getContext('2d').drawImage(img,0,0,tw,th);
    it.thumb=c.toDataURL('image/jpeg',.7);
  }catch(e){}
  if(c)free(c);
}
function readVideo(it){
  return new Promise((res,rej)=>{
    const v=document.createElement('video');
    v.preload='metadata';v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');
    let fin=false,timer;
    const done=ok=>{if(fin)return;fin=true;clearTimeout(timer);v.removeAttribute('src');v.load();ok?res():rej(new Error('Не удалось прочитать видео (формат не поддерживается браузером)'))};
    v.onloadedmetadata=()=>{
      it.w=v.videoWidth;it.h=v.videoHeight;it.duration=v.duration;
      if(!it.w||!it.h)return done(false);
      try{v.currentTime=isFinite(v.duration)?Math.min(1,v.duration*0.1):0}catch(e){}
      timer=setTimeout(()=>done(true),3500);
    };
    v.onseeked=()=>{
      try{
        const c=document.createElement('canvas'),k=Math.min(1,200/Math.max(it.w,it.h));
        c.width=Math.round(it.w*k);c.height=Math.round(it.h*k);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        it.thumb=c.toDataURL('image/jpeg',.7);free(c);
      }catch(e){}
      done(true);
    };
    v.onerror=()=>done(false);
    timer=setTimeout(()=>done(!!it.w),10000);
    v.src=it.url;
  });
}

/* ---------- добавление файлов ---------- */
const IMG_EXT=/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif|tiff?)$/i,VID_EXT=/\.(mp4|mov|m4v|webm|mkv|avi|3gp|mpe?g|ogv)$/i;
function addFiles(list){
  let skipped=0;
  for(const f of [...list]){
    const kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':IMG_EXT.test(f.name)?'image':VID_EXT.test(f.name)?'video':null;
    if(!kind){skipped++;continue}
    if(kind==='video'&&!vFormats.length){toast('Этот браузер не умеет сжимать видео','error');skipped++;continue}
    const it={id:++uid,file:f,kind,name:f.name||('file-'+uid),size:f.size,url:URL.createObjectURL(f),status:'loading',progress:0,w:0,h:0,duration:0,result:null,error:'',broken:false,custom:null,open:false,form:null,selected:false,stale:false,usedKey:'',est:null,estKey:'',estTimer:0};
    state.items.push(it);createCard(it);renderCard(it);
    // файлы читаются строго по очереди, с паузой — интерфейс не подвисает даже на десятках больших фото
    state.load.total++;
    metaChain=metaChain.then(async()=>{
      try{
        if(state.items.includes(it)){
          try{await(kind==='image'?readImage(it):readVideo(it));it.status='idle'}
          catch(e){it.status='error';it.broken=true;it.error=e.message||'Ошибка чтения'}
          if(state.items.includes(it)){
            if(it.thumb)it.el.img.src=it.thumb;
            renderCard(it);
          }
        }
      }finally{state.load.done++}
      renderAll();scheduleAllEst();
      await sleep(0);
    });
  }
  if(state.items.some(i=>i.kind==='image')&&usesWasm(settings.img))Codec.warm(settings.img.mode==='auto'?settings.img.acodec:settings.img.format);
  if(skipped)toast(`Пропущено файлов: ${skipped} (не фото и не видео)`,'info');
  renderAll();
}

let estChain=Promise.resolve();
const wantEst=it=>!(it.kind==='image'&&usesWasm(eff(it)))&&(it.open||state.items.filter(x=>x.kind===it.kind&&!x.broken).length===1);
function renderEst(it,loading){
  const box=it.xest;if(!box)return;
  if(it.kind==='video'){
    const p=videoPlan(it,eff(it));
    box.hidden=!isFinite(p.est);
    box.innerHTML=isFinite(p.est)?`Ожидаемый размер: <b>≈ ${fmtBytes(p.est)}</b> из ${fmtBytes(it.size)}`:'';
    return;
  }
  if(usesWasm(eff(it))){box.hidden=false;box.textContent=eff(it).mode==='auto'?'Авто-режим: качество подбирается при сжатии, итоговый размер будет известен после него.':'Размер этим кодеком считается при сжатии.';return}
  const key=keyOf(it);
  if(it.est&&it.est.key===key){
    const d=pct(it.est.size,it.size);
    box.hidden=false;
    box.innerHTML=it.est.kept?'Сжатие с такими настройками не уменьшит размер — останется оригинал.':`Ожидаемый результат: ${fmtBytes(it.size)} → <b>${fmtBytes(it.est.size)}</b> <span class="save ${d>=0?'good':'bad'}">${d>=0?'−':'+'}${Math.abs(d)}%</span>`;
  }else if(loading){box.hidden=false;box.textContent='Расчёт размера…'}

function scheduleEst(it){
  if(it.kind==='image'&&!it.broken&&usesWasm(eff(it))){renderEst(it);return}
  if(!state.items.includes(it)||it.broken||it.status==='loading'||it.status==='working'||!wantEst(it))return;
  if(it.kind==='video'){renderEst(it);return}
  if(it.status==='done'&&!it.stale){renderEst(it);return}
  const key=keyOf(it);
  if(it.est&&it.est.key===key){renderEst(it);return}
  if(it.estKey===key)return;
  clearTimeout(it.estTimer);
  it.est=null;it.estKey=key;renderEst(it,true);
  it.estTimer=setTimeout(()=>{
    estChain=estChain.then(async()=>{
      const ok=state.items.includes(it)&&!state.busy&&it.status!=='working'&&it.status!=='loading'&&keyOf(it)===key&&wantEst(it);
      if(!ok){if(it.estKey===key)it.estKey='';if(state.items.includes(it))renderEst(it);return}
      try{
        const S={img:clone(eff(it)),vid:clone(settings.vid),common:clone(settings.common)};
        const r=await compressImage(it,S,new AbortController().signal);
        if(r.url)URL.revokeObjectURL(r.url);

      }catch(e){it.est=null}
      it.estKey='';
      if(state.items.includes(it)){renderEst(it);if(it.status!=='working')renderCard(it)}
      await sleep(20);
    }).catch(()=>{});
  },450);
}

    if(onStage)onStage('Подготовка…',.04);
    abortCheck(sig);
    if(!sw||!sh)throw new Error('Не удалось прочитать изображение');
    const plan=imagePlan({w:sw,h:sh},s);
    let k=1;
    const cap=WASM_CAP[codec]||20e6;
    const render=kk=>{
      if(canvas){free(canvas);canvas=null}
      pw=Math.max(1,Math.round(plan.w*kk));ph=Math.max(1,Math.round(plan.h*kk));
      if(pw*ph>cap){const f=Math.sqrt(cap/(pw*ph));pw=Math.max(1,Math.floor(pw*f));ph=Math.max(1,Math.floor(ph*f))}
      canvas=scaledCanvas(dec.src,sw,sh,pw,ph,codec==='mozjpeg'?s.bg:null);
      const ratio=pw/sw;
      if(s.sharpen!==false&&ratio<0.85)sharpenCanvas(canvas,Math.min(.4,.12+(.85-ratio)*.45));
      const img=canvas.getContext('2d').getImageData(0,0,pw,ph);
      free(canvas);canvas=null;
      return img.data.buffer;
    };
    let r=null,tries=0;
    const manualQ=codec==='avif'?Math.max(5,Math.round(num(s.quality,78)*.75)):clamp(Math.round(num(s.quality,78)),10,98);
    for(;;){
      abortCheck(sig);
      buf=render(k);
      if(onStage)onStage('Подготовка…',.1);
      const base={codec,w:pw,h:ph,buf};
      if(auto)r=await Codec.call({...base,op:'auto',target:prio.ssim,fq:prio.fq[codec]},[buf],stage,sig);
      else if(s.target)r=await Codec.call({...base,op:'size',q:manualQ,limit:num(s.targetKb,500)*1024},[buf],stage,sig);
      else r=await Codec.call({...base,op:'fixed',q:manualQ},[buf],stage,sig);
      buf=null;
      if(!s.target||auto||r.fit!==false||++tries>7)break;
      k*=.8; // даже минимальное качество не уложилось в лимит — уменьшаем разрешение и пробуем снова
    }
    abortCheck(sig);
    const blob=new Blob([r.bytes],{type:fmt.mime});
    const resized=pw!==sw||ph!==sh;
    if(c.keep&&!resized&&blob.size>=it.size)return mkResult(it.file,it.name,sw,sh,'',true);
    const label=fmt.label+(auto?` · авто q${r.q}`+(r.ssim?` · SSIM ${r.ssim.toFixed(3)}`:''):` · q${r.q}`);
    return mkResult(blob,baseName(it.name)+safeSuffix()+'.'+fmt.ext,pw,ph,label,false);
  }finally{
    clearInterval(tick);
    dec.close();
    if(canvas)free(canvas);
  }
}

// Точка входа: современные кодеки, а если они недоступны (нет сети при первом запуске и т.п.) — запасной вариант на кодерах браузера
async function compressImage(it,S,sig,onStage){
  if(usesWasm(S.img)&&Codec.ok()){
    try{
      return await compressImageWasm(it,S,sig,onStage);
    }catch(e){
      if(sig.aborted||(e&&e.name==='AbortError'))throw e;
      if(!(e&&e.load))throw e;
      Codec.failed=true;
      if(!wasmWarned){wasmWarned=true;toast('Кодеки AVIF/MozJPEG не загрузились (нужен интернет при первом запуске). Использую кодеры браузера.','error')}
    }
  }else if(usesWasm(S.img)&&!wasmWarned){
    wasmWarned=true;toast('Этот браузер не поддерживает современные кодеки. Использую встроенные кодеры.','info');
  }
  if(onStage)onStage('Сжатие…',-1);
  const s2={...effImg(S.img),mode:'manual',format:S.img.mode==='auto'?(CAN_WEBP?'webp':'jpeg'):(S.img.format==='avif'?(CAN_WEBP?'webp':'jpeg'):S.img.format==='mozjpeg'?'jpeg':S.img.format)};
  if(S.img.mode==='auto')s2.quality=(PRIO[S.img.prio]||PRIO.balance).fq.webp;
  return compressImageCanvas(it,{...S,img:s2},sig);
}


/* ---------- сжатие: видео ---------- */
async function compressVideo(it,S,sig,onProgress){
  const s=S.vid,c=S.common,plan=videoPlan(it,s),fmt=pickVFormat(s.format);
  const video=document.createElement('video');
  video.playsInline=true;video.setAttribute('playsinline','');video.preload='auto';video.src=it.url;
  await new Promise((res,rej)=>{
    let t=setTimeout(res,2500);
    video.onloadeddata=()=>{clearTimeout(t);res()};
    video.onerror=()=>{clearTimeout(t);rej(new Error('Не удалось открыть видео'))};
  });
  abortCheck(sig);
  const canvas=mkCanvas(plan.w,plan.h),ctx=canvas.getContext('2d',{alpha:false});
  ctx.imageSmoothingQuality='high';
  const draw=()=>{try{ctx.drawImage(video,0,0,plan.w,plan.h)}catch(e){}};
  const vs=plan.fpsArg?canvas.captureStream(plan.fpsArg):canvas.captureStream();
  const tracks=[...vs.getVideoTracks()];
  let actx=null,warn='',hasAudio=false;
  if(s.audio==='keep'){
    try{
      actx=new(window.AudioContext||window.webkitAudioContext)();
      if(actx.state!=='running')await Promise.race([actx.resume(),new Promise(r=>setTimeout(r,1200))]);
      if(actx.state!=='running')throw new Error('audio suspended');
      const node=actx.createMediaElementSource(video),dest=actx.createMediaStreamDestination();
      node.connect(dest);tracks.push(...dest.stream.getAudioTracks());hasAudio=true;
    }catch(e){
      if(actx){actx.close().catch(()=>{});actx=null}
      video.muted=true;warn='звук не сохранён (ограничение браузера)';
    }
  }else video.muted=true;

  const opts={mimeType:fmt.mime,videoBitsPerSecond:Math.round(plan.vbps)};
  if(hasAudio&&plan.abps)opts.audioBitsPerSecond=plan.abps;
  let rec;
  try{rec=new MediaRecorder(new MediaStream(tracks),opts)}
  catch(e){tracks.forEach(t=>t.stop());if(actx)actx.close().catch(()=>{});throw new Error('Браузер не смог запустить кодирование: '+(e.message||e))}

  const chunks=[];let alive=true,aborted=false,timer=0,rvf=0;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const cleanup=()=>{
    alive=false;clearInterval(timer);
    try{video.pause()}catch(e){}
    try{if(rec.state!=='inactive')rec.stop()}catch(e){}
    tracks.forEach(t=>t.stop());
    if(actx)actx.close().catch(()=>{});
    video.removeAttribute('src');video.load();
  };
  const finished=new Promise((resolve,reject)=>{
    video.onended=()=>{draw();setTimeout(()=>{try{if(rec.state!=='inactive')rec.stop()}catch(e){}},250)};
    video.onpause=()=>{if(alive&&!video.ended&&!aborted)video.play().catch(()=>{})};
    video.onerror=()=>reject(new Error('Ошибка воспроизведения видео при сжатии'));
    rec.onerror=e=>reject((e&&e.error)||new Error('Ошибка кодирования'));
    rec.onstop=resolve;
    sig.addEventListener('abort',()=>{aborted=true;reject(new DOMException('Aborted','AbortError'))});
  });
  finished.catch(()=>{});

  try{
    try{await video.play()}
    catch(e){
      video.muted=true;
      if(s.audio==='keep'){warn='звук не сохранён (ограничение браузера)'}
      try{await video.play()}catch(e2){throw new Error('Браузер не разрешил воспроизведение. Нажмите «Сжать» ещё раз.')}
    }
    const tick=()=>{if(!alive)return;draw();schedule()};
    const schedule=()=>{if('requestVideoFrameCallback' in video)video.requestVideoFrameCallback(tick);else rvf=requestAnimationFrame(tick)};
    draw();schedule();
    rec.start(1000);
    const known=isFinite(video.duration)&&video.duration>0;
    if(!known)onProgress(-1);
    timer=setInterval(()=>{if(known)onProgress(Math.min(.99,video.currentTime/video.duration))},300);
    await finished;
    abortCheck(sig);
    const blob=new Blob(chunks,{type:fmt.mime.split(';')[0]});
    if(!blob.size)throw new Error('Получился пустой файл — браузер не смог закодировать видео');
    if(c.keep&&blob.size>=it.size&&plan.w===even(it.w)&&plan.h===even(it.h))return mkResult(it.file,it.name,it.w,it.h,'',true);
    return mkResult(blob,baseName(it.name)+safeSuffix()+'.'+fmt.ext,plan.w,plan.h,fmt.label,false,warn);
  }finally{cancelAnimationFrame(rvf);cleanup();free(canvas)}
}

/* ---------- очередь ---------- */
async function lock(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(state.busy&&document.visibilityState==='visible')lock()});
window.addEventListener('beforeunload',e=>{if(state.busy){e.preventDefault();e.returnValue=''}});

function clearResult(it){if(it.result&&it.result.url)URL.revokeObjectURL(it.result.url);it.result=null}
async function processItem(it){
  clearResult(it);
  it.status='working';it.stage='';it.progress=it.kind==='video'?0:.02;it.error='';it.stale=false;it.selected=false;
  const key=keyOf(it);
  renderCard(it);setProgress(it);renderSummary();renderSelbar();
  const S={img:clone(it.kind==='image'?eff(it):settings.img),vid:clone(it.kind==='video'?eff(it):settings.vid),common:clone(settings.common)};
  const ctrl=new AbortController();it.ctrl=ctrl;
  try{
    it.result=it.kind==='image'?await compressImage(it,S,ctrl.signal,(t,p)=>{if(t)it.stage=t;if(p!=null)it.progress=p;setProgress(it)}):await compressVideo(it,S,ctrl.signal,p=>{it.progress=p;setProgress(it)});
    it.status='done';it.usedKey=key;it.selected=true;
  }catch(e){
    if(e&&e.name==='AbortError')it.status='idle';
    else{it.status='error';it.error=(e&&e.message)||String(e);toast(`Не удалось сжать «${it.name}»`,'error')}
  }
  it.ctrl=null;
  if(state.items.includes(it)){renderCard(it);renderSummary();renderSelbar()}
}
const IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(UA);
function concurrency(){
  const t=settings.app.threads;
  if(t!=='auto'&&Number(t)>0)return clamp(Number(t),1,4);
  const hw=navigator.hardwareConcurrency||4;
  return IS_MOBILE?clamp(hw-2,1,2):clamp(hw-1,1,4);
}
// бюджет памяти: суммарно в обработке не больше этого числа пикселей (один большой файл всегда может идти один)
const PIXEL_BUDGET=IS_MOBILE?24e6:64e6;
function weightOf(it){
  if(it.kind!=='image'||!it.w)return 4e6;
  const p=imagePlan(it,effImg(eff(it)));
  return Math.min(p.w*p.h,WASM_CAP.avif);
}
function runPool(list,limit,weightFn){
  return new Promise(resolve=>{
    let idx=0,wsum=0;const active=new Set();
    const pump=()=>{
      while(!state.stop&&idx<list.length&&active.size<limit){
        const it=list[idx],w=weightFn(it);
        if(active.size&&wsum+w>PIXEL_BUDGET)break;
        idx++;
        if(!state.items.includes(it)){state.runTotal--;continue}
        active.add(it);wsum+=w;
        processItem(it).finally(()=>{active.delete(it);wsum-=w;state.runDone++;updateRunProgress();pump()});
      }
      if(!active.size&&(idx>=list.length||state.stop))resolve();
    };
    pump();
  });
}
async function runItems(list){
  if(!list.length||state.busy)return;
  state.busy=true;state.stop=false;state.runTotal=list.length;state.runDone=0;
  const n=concurrency();Codec.max=n;
  renderAll();lock();updateRunProgress();
  // фото идут пачкой в несколько потоков, видео — по одному (кодируются в реальном времени)
  await runPool(list.filter(i=>i.kind==='image'),n,weightOf);
  if(!state.stop)await runPool(list.filter(i=>i.kind==='video'),1,()=>0);
  state.busy=false;unlock();
  if(list.length>1)state.expanded=true;
  renderAll();refreshPlans();scheduleAllEst();
  const done=list.filter(i=>i.status==='done').length;
  if(done)toast(`Готово: ${done} ${plural(done,'файл','файла','файлов')}`,'success');
  if(done&&settings.app.autoDownload&&!state.stop)downloadSelected();
}
function runAll(){
  if(state.busy){state.stop=true;state.items.forEach(i=>i.ctrl&&i.ctrl.abort());return}
  const todo=state.items.filter(needsRun);
  if(todo.length){runItems(todo);return}
  downloadSelected(); // всё уже сжато — главная кнопка скачивает выбранное
}
async function redoAll(){
  if(state.busy)return;
  const list=state.items.filter(i=>!i.broken&&(i.status==='done'||i.status==='idle'||i.status==='error'));
  if(!list.length)return;
  const ok=await askConfirm({title:'Сжать всё заново?',text:'Текущие результаты будут заменены. Перед этим можно поменять настройки.',ok:'Сжать заново'});
  if(ok)runItems(list);
}

/* ---------- скачивание / ZIP / просмотр ---------- */
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)}
function resUrl(it){return it.result.kept?it.url:it.result.url}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
// ZIP без сжатия (store). Данные файлов не копируются в память целиком: в архив попадают сами Blob-ы.
async function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const size=f.blob.size,name=enc.encode(f.name);
    let crc;
    {const data=new Uint8Array(await f.blob.arrayBuffer());crc=crc32(data)}
    const l=new DataView(new ArrayBuffer(30));
    l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(8,0,true);l.setUint16(10,time,true);l.setUint16(12,date,true);
    l.setUint32(14,crc,true);l.setUint32(18,size,true);l.setUint32(22,size,true);l.setUint16(26,name.length,true);l.setUint16(28,0,true);
    parts.push(l.buffer,name,f.blob);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,time,true);c.setUint16(14,date,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);
    c.setUint32(42,offset,true);
    central.push(c.buffer,name);
    offset+=30+name.length+size;
    await sleep(0);
  }
  const cdSize=sum(central.map(x=>x.byteLength));
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,offset,true);
  return new Blob([...parts,...central,e.buffer],{type:'application/zip'});
}
let dlBusy=false;
async function downloadSelected(){
  const sel=doneItems().filter(i=>i.selected);
  if(!sel.length||dlBusy)return;
  if(sel.length===1){const i=sel[0];download(resUrl(i),i.result.name);return}
  if(sum(sel.map(i=>i.result.size))>3.8e9){toast('Слишком большой архив (больше ~3.8 ГБ). Выберите меньше файлов или скачайте по одному.','error');return}
  dlBusy=true;renderSelbar();updateRun();
  const b=$('#dlSel');b.disabled=true;b.textContent='Собираем архив…';
  try{
    const used=new Set(),files=sel.map(i=>{
      let n=i.result.name,k=1;
      while(used.has(n.toLowerCase())){const x=i.result.name.lastIndexOf('.');n=x>0?`${i.result.name.slice(0,x)} (${++k})${i.result.name.slice(x)}`:`${i.result.name} (${++k})`}
      used.add(n.toLowerCase());return{name:n,blob:i.result.blob};
    });
    const zip=await makeZip(files),url=URL.createObjectURL(zip);
    download(url,`compressed-${files.length}.zip`);setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast('Не удалось собрать ZIP: '+(e.message||e),'error')}
  dlBusy=false;renderSelbar();updateRun();
}
$('#dlSel').addEventListener('click',downloadSelected);

let modalVideo=null;
function buildPlayer(src,fallbackDur){
  const wrap=el('div','player');
  const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.preload='metadata';v.src=src;
  const bar=el('div','pctl',`<button type="button" class="icon-btn" data-p="play" aria-label="Воспроизвести">${I.play}</button><input type="range" min="0" max="1000" value="0" aria-label="Перемотка"><span class="ptime">0:00</span><button type="button" class="icon-btn" data-p="mute" aria-label="Звук">${I.vol}</button>`);
  wrap.append(v,bar);
  const seek=$('input',bar),time=$('.ptime',bar),pb=$('[data-p=play]',bar),mb=$('[data-p=mute]',bar);
  const dur=()=>isFinite(v.duration)&&v.duration>0?v.duration:(fallbackDur||0);
  const upd=()=>{const d=dur();seek.value=d?Math.min(1000,v.currentTime/d*1000):0;seek.style.setProperty('--fill',(seek.value/10)+'%');time.textContent=fmtDur(v.currentTime).replace('—','0:00')+' / '+fmtDur(d)};
  const toggle=()=>{v.paused?v.play().catch(()=>{}):v.pause()};
  pb.onclick=toggle;v.onclick=toggle;
  v.onplay=()=>{pb.innerHTML=I.pause};v.onpause=()=>{pb.innerHTML=I.play};
  v.ontimeupdate=upd;v.onloadedmetadata=upd;v.ondurationchange=upd;
  seek.oninput=()=>{const d=dur();if(d){try{v.currentTime=seek.value/1000*d}catch(e){}}upd()};
  mb.onclick=()=>{v.muted=!v.muted;mb.innerHTML=v.muted?I.mute:I.vol};
  upd();modalVideo=v;
  return wrap;
}
function openPreview(it){
  const r=it.result,body=$('#modalBody');
  $('#modalTitle').textContent=it.name;body.innerHTML='';
  if(it.kind==='image'){
    const w=el('div','cmp');
    w.style.aspectRatio=`${r.w} / ${r.h}`;w.style.width=`min(100%, ${(70*r.w/r.h).toFixed(2)}dvh)`;
    w.innerHTML=`<img src="${it.url}" alt="" draggable="false"><img class="after" src="${resUrl(it)}" alt="" draggable="false"><div class="div"></div>
    <span class="lab l">Оригинал · ${fmtBytes(it.size)}</span><span class="lab r">Сжато · ${fmtBytes(r.size)}</span>`;
    // ползунок на pointer events: без скрытого input[type=range], который на телефонах конфликтовал с прокруткой окна
    w.tabIndex=0;w.setAttribute('role','slider');w.setAttribute('aria-label','Сравнение до и после');
    w.setAttribute('aria-valuemin','0');w.setAttribute('aria-valuemax','100');w.setAttribute('aria-valuenow','50');
    let pos=50,drag=false;
    const setP=v=>{pos=clamp(v,0,100);w.style.setProperty('--p',pos+'%');w.setAttribute('aria-valuenow',String(Math.round(pos)))};
    const fromEv=e=>{const rc=w.getBoundingClientRect();if(rc.width)setP((e.clientX-rc.left)/rc.width*100)};
    w.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      drag=true;try{w.setPointerCapture(e.pointerId)}catch(x){}
      fromEv(e);e.preventDefault();w.focus({preventScroll:true});
    });
    w.addEventListener('pointermove',e=>{if(drag){fromEv(e);e.preventDefault()}});
    const end=e=>{if(!drag)return;drag=false;try{w.releasePointerCapture(e.pointerId)}catch(x){}};
    w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
    w.addEventListener('lostpointercapture',()=>{drag=false});
    w.addEventListener('dblclick',()=>setP(50));
    w.addEventListener('keydown',e=>{
      const st=e.shiftKey?10:2;
      if(e.key==='ArrowLeft'){setP(pos-st);e.preventDefault()}
      else if(e.key==='ArrowRight'){setP(pos+st);e.preventDefault()}
      else if(e.key==='Home'){setP(0);e.preventDefault()}
      else if(e.key==='End'){setP(100);e.preventDefault()}
    });
    body.appendChild(w);
  }else body.appendChild(buildPlayer(resUrl(it),it.duration));
  $('#modalNote').textContent=r.kept?'Оригинал не изменён: сжатие не уменьшило размер':`${fmtBytes(it.size)} → ${fmtBytes(r.size)} · ${r.w}×${r.h} · ${r.label}`;
  $('#modal').hidden=false;syncLock();
}
function closeModal(){
  if(modalVideo){try{modalVideo.pause()}catch(e){}modalVideo=null}
  $('#modal').hidden=true;$('#modalBody').innerHTML='';syncLock();
}

/* ---------- действия ---------- */
$('#list').addEventListener('click',async e=>{
  const card=e.target.closest('.card');if(!card)return;
  const it=find(card.dataset.id);if(!it)return;
  const b=e.target.closest('[data-act]');
  if(!b){
    if(e.target.closest('.xpanel'))return;
    // клик по миниатюре / чекбоксу готового файла — переключает выбор, карточка не раскрывается
    if(e.target.closest('.thumb')&&it.status==='done'&&it.result){toggleSel(it);return}
    if(e.target.closest('.crow')&&eligible(it))setOpen(it,!it.open);
    return;
  }
  switch(b.dataset.act){
    case'toggle':setOpen(it,!it.open);break;
    case'remove':
      if(it.status==='working')return;
      clearTimeout(it.estTimer);
      URL.revokeObjectURL(it.url);clearResult(it);it.el.root.remove();state.items=state.items.filter(x=>x!==it);renderAll();scheduleAllEst();break;
    case'run':if(state.busy)return toast('Дождитесь окончания текущего сжатия','info');runItems([it]);break;
    case'cancel':it.ctrl&&it.ctrl.abort();break;
    case'view':if(it.result)openPreview(it);break;
    case'dl':if(it.result)download(resUrl(it),it.result.name);break;
    case'share':
      try{await navigator.share({files:[new File([it.result.blob],it.result.name,{type:it.result.blob.type})]})}catch(err){}
      break;
  }
});
$('#clearBtn').addEventListener('click',async()=>{
  if(state.busy)return;
  if(state.items.some(i=>i.result)){
    const ok=await askConfirm({title:'Очистить список?',text:'Файлы и результаты сжатия исчезнут со страницы. Уже скачанные файлы останутся у вас.',ok:'Очистить',danger:true});
    if(!ok)return;
  }
  state.items.forEach(it=>{clearTimeout(it.estTimer);URL.revokeObjectURL(it.url);clearResult(it)});
  state.items=[];state.expanded=false;$('#list').innerHTML='';renderAll();
});
$('#moreBtn').addEventListener('click',()=>{state.expanded=!state.expanded;applyList()});
$('#redoBtn').addEventListener('click',redoAll);
$('#modalClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!ov.hidden)closeSheet(null);else if(!$('#modal').hidden)closeModal();
});
$$('[data-run]').forEach(b=>b.addEventListener('click',runAll));

/* ---------- ввод файлов ---------- */
$('#file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
const drop=$('#drop');
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{if(hasFiles(e)){e.preventDefault();drop.classList.add('over')}}));
window.addEventListener('dragleave',e=>{if(!e.relatedTarget)drop.classList.remove('over')});
window.addEventListener('drop',e=>{if(hasFiles(e)){e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)}});
document.addEventListener('paste',e=>{const f=e.clipboardData&&e.clipboardData.files;if(f&&f.length)addFiles(f)});

/* ---------- тема ---------- */
const themeBtn=$('#themeBtn'),rootEl=document.documentElement,darkMq=matchMedia('(prefers-color-scheme: dark)');
let themeMode='auto';
try{const t=localStorage.getItem('sq-theme');if(t==='light'||t==='dark')themeMode=t}catch(e){}
function applyTheme(){
  const t=themeMode==='auto'?(darkMq.matches?'dark':'light'):themeMode;
  rootEl.dataset.theme=t;themeBtn.innerHTML=t==='dark'?I.sun:I.moon;
  $('meta[name=theme-color]').content=t==='dark'?'#0d0d0f':'#f5f5f3';
}
function setThemeMode(m){
  themeMode=m;
  try{m==='auto'?localStorage.removeItem('sq-theme'):localStorage.setItem('sq-theme',m)}catch(e){}
  applyTheme();
}
darkMq.addEventListener&&darkMq.addEventListener('change',()=>{if(themeMode==='auto')applyTheme()});
themeBtn.addEventListener('click',()=>setThemeMode(rootEl.dataset.theme==='dark'?'light':'dark'));
applyTheme();

/* ---------- версия ---------- */
$('#verBtn').textContent='v'+APP.v;
$('#verBtn').addEventListener('click',()=>openSheet(s=>{
  s._opts=null;
  s.innerHTML=`<div class="grab"></div><div class="sheet-head"><b>Сжатие v${esc(APP.v)}</b><button class="icon-btn sm" data-close aria-label="Закрыть">${I.x}</button></div>
  <div class="sheet-list sg"><div class="sg-about" style="text-align:left;padding:0 6px 8px">Сборка от ${esc(APP.build)}. Если видите эту версию — файл обновился.</div>
  <div class="sg-t">Что нового</div>
  <ul class="notes">${APP.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
}));

/* ---------- настройки программы: пресеты, импорт/экспорт, параллельность ---------- */
let presets=[];
try{const p=JSON.parse(localStorage.getItem('sq-presets-v1')||'[]');if(Array.isArray(p))presets=p.filter(x=>x&&typeof x.name==='string'&&typeof x.id==='string').slice(0,30)}catch(e){}
const savePresets=()=>{try{localStorage.setItem('sq-presets-v1',JSON.stringify(presets))}catch(e){}};
const BUILTIN=[
  {id:'b-web',name:'Для сайта',img:{mode:'auto',prio:'balance',acodec:'avif'},vid:{resMode:'1080',qmode:'preset',preset:'medium'}},
  {id:'b-msg',name:'Для мессенджера',img:{mode:'auto',prio:'size',acodec:'mozjpeg'},vid:{resMode:'720',qmode:'preset',preset:'low',fps:'30'}},
  {id:'b-arch',name:'Архив: неотличимо от оригинала',img:{mode:'auto',prio:'quality',acodec:'avif'},vid:{resMode:'original',qmode:'preset',preset:'high'}},
  {id:'b-compat',name:'Максимальная совместимость',img:{mode:'auto',prio:'balance',acodec:'mozjpeg'},vid:{resMode:'1080',qmode:'preset',preset:'medium'}}
];
const allPresets=()=>[...BUILTIN.map(p=>({...p,builtin:true})),...presets];
const CODEC_NAMES={avif:'AVIF',webp:'WebP',mozjpeg:'JPEG',jpeg:'JPEG',png:'PNG',orig:'как есть'};
const PRIO_NAMES={quality:'качество',balance:'баланс',size:'размер'};
function presetNote(p){
  const i={...DEFAULTS.img,...(p.img||{})};
  return i.mode==='auto'?`Авто · ${CODEC_NAMES[i.acodec]||'AVIF'} · ${PRIO_NAMES[i.prio]||'баланс'}`:`${CODEC_NAMES[i.format]||i.format} · ${i.quality}%`;
}
// принимаем только известные поля нужного типа — чужой или повреждённый файл настроек ничего не сломает
function sanitize(g,src){
  const out={};
  if(!src||typeof src!=='object')return out;
  for(const k of Object.keys(DEFAULTS[g])){
    if(!(k in src))continue;
    const v=src[k],d=DEFAULTS[g][k];
    if(typeof v===typeof d||(v===''&&typeof d==='number'))out[k]=v;
  }
  if(g==='img'){
    if(out.mode&&!['auto','manual'].includes(out.mode))delete out.mode;
    if(out.prio&&!PRIO[out.prio])delete out.prio;
    if(out.acodec&&!['avif','webp','mozjpeg'].includes(out.acodec))delete out.acodec;
    if(out.format&&!['webp','jpeg','mozjpeg','avif','png','orig'].includes(out.format))delete out.format;
    if(out.bg&&!/^#[0-9a-f]{6}$/i.test(out.bg))delete out.bg;
  }
  if(g==='vid'&&out.format&&out.format!=='auto'&&!vFormats.some(f=>f.mime===out.format))delete out.format;
  if(g==='common'&&typeof out.suffix==='string')out.suffix=out.suffix.replace(/[\\/:*?"<>|]/g,'').slice(0,24);
  return out;
}
function applyBundle(b){
  Object.assign(settings.img,sanitize('img',b.img));
  Object.assign(settings.vid,sanitize('vid',b.vid));
  Object.assign(settings.common,sanitize('common',b.common));
  syncCommon();afterChange();
}
const pid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function exportSettings(){
  const data={app:'squeeze',version:APP.v,exportedAt:new Date().toISOString(),settings:{img:settings.img,vid:settings.vid,common:settings.common,app:settings.app},theme:themeMode,presets};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  download(url,'squeeze-settings.json');setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast('Настройки сохранены в файл','success');
}
async function importSettings(file){
  try{
    if(file.size>1e6)throw new Error('big');
    const d=JSON.parse(await file.text());
    if(!d||d.app!=='squeeze'||!d.settings||typeof d.settings!=='object')throw new Error('format');
    applyBundle(d.settings);
    const a=d.settings.app;
    if(a&&typeof a==='object'){
      if(a.threads==='auto'||[1,2,3,4].includes(a.threads))settings.app.threads=a.threads;
      if(typeof a.autoDownload==='boolean')settings.app.autoDownload=a.autoDownload;
    }
    if(['auto','light','dark'].includes(d.theme))setThemeMode(d.theme);
    let added=0;
    if(Array.isArray(d.presets))for(const p of d.presets.slice(0,30)){
      if(!p||typeof p.name!=='string'||presets.length>=30)continue;
      const name=p.name.trim().slice(0,40);
      if(!name||presets.some(x=>x.name===name))continue;
      presets.push({id:pid(),name,img:sanitize('img',p.img),vid:sanitize('vid',p.vid),common:sanitize('common',p.common)});added++;
    }
    savePresets();saveSettings();
    toast('Настройки импортированы'+(added?`, пресетов добавлено: ${added}`:''),'success');
  }catch(e){toast('Не удалось импортировать: это не файл настроек программы','error')}
}
function askText({title,placeholder,ok}){
  return openSheet(s=>{
    s._opts=null;
    s.innerHTML=`<div class="grab"></div><div class="dlg"><b>${esc(title)}</b><input class="ctl txt" id="askIn" type="text" maxlength="40" placeholder="${esc(placeholder||'')}" autocomplete="off"><div class="dbtns"><button type="button" class="btn" data-close>Отмена</button><button type="button" class="btn primary" id="askOk">${esc(ok)}</button></div></div>`;
    const inp=$('#askIn',s),go=()=>{const v=inp.value.trim();if(v)closeSheet({text:v})};
    $('#askOk',s).addEventListener('click',e=>{e.stopPropagation();go()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    setTimeout(()=>inp.focus(),60);
  }).then(v=>v&&v.text||null);
}
function settingsHTML(){
  const seg=(items,cur,act)=>`<div class="seg">${items.map(([v,l])=>`<button type="button" class="segb${String(v)===String(cur)?' on':''}" data-s="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const row=p=>`<div class="prow"><button type="button" class="pmain" data-s="papply" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><small>${esc(presetNote(p))}</small></button>${p.builtin?'':`<button type="button" class="icon-btn sm" data-s="pdel" data-id="${esc(p.id)}" aria-label="Удалить пресет">${I.x}</button>`}</div>`;
  return`<div class="grab"></div><div class="sheet-head"><b>Настройки</b><button class="icon-btn sm" data-close aria-label="Закрыть">${I.x}</button></div>
  <div class="sheet-list sg">
    <div class="sg-t">Внешний вид</div>
    <div class="sg-r"><span>Тема</span>${seg([['auto','Авто'],['light','Светлая'],['dark','Тёмная']],themeMode,'theme')}</div>
    <div class="sg-t">Обработка</div>
    <div class="sg-r"><span>Файлов одновременно<small>Сейчас ${concurrency()}. Больше — быстрее, но расходует память</small></span>${seg([['auto','Авто'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],settings.app.threads,'threads')}</div>
    <label class="sg-r switchrow"><span>Скачивать сразу после сжатия<small>Один файл или ZIP со всеми готовыми</small></span><span class="switch"><input type="checkbox" data-s="autodl"${settings.app.autoDownload?' checked':''}><span></span></span></label>
    <div class="sg-t">Пресеты</div>
    <div class="plist">${allPresets().map(row).join('')}</div>
    <button type="button" class="btn wide" data-s="psave">Сохранить текущие настройки как пресет</button>
    <div class="sg-t">Перенос и сброс</div>
    <div class="sg-btns"><button type="button" class="btn" data-s="export">Экспорт в файл</button><button type="button" class="btn" data-s="import">Импорт из файла</button></div>
    <button type="button" class="btn wide" data-s="reset">Сбросить все настройки</button>
    <div class="sg-about">Сжатие v${esc(APP.v)} · сборка ${esc(APP.build)}</div>
  </div>`;
}
function openSettings(){
  return openSheet(s=>{s._opts=null;s._settings=true;s.innerHTML=settingsHTML()});
}
function rerenderSettings(){
  if(ov.hidden||!sheet._settings)return;
  const l=$('.sheet-list',sheet),t=l?l.scrollTop:0;
  sheet.innerHTML=settingsHTML();
  const n=$('.sheet-list',sheet);if(n)n.scrollTop=t;
}
sheet.addEventListener('click',async e=>{
  const b=e.target.closest('[data-s]');
  if(!b||!sheet._settings||b.tagName==='INPUT')return;
  const a=b.dataset.s,id=b.dataset.id,v=b.dataset.v;
  if(a==='theme'){setThemeMode(v);rerenderSettings()}
  else if(a==='threads'){settings.app.threads=v==='auto'?'auto':Number(v);saveSettings();rerenderSettings()}
  else if(a==='papply'){
    const p=allPresets().find(x=>x.id===id);
    if(p){applyBundle(p);toast(`Применён пресет «${p.name}»`,'success');rerenderSettings()}
  }
  else if(a==='pdel'){presets=presets.filter(x=>x.id!==id);savePresets();rerenderSettings()}
  else if(a==='psave'){
    if(presets.length>=30)return toast('Можно хранить не больше 30 своих пресетов','info');
    closeSheet(null);
    const name=await askText({title:'Название пресета',placeholder:'Например, «Для отчёта»',ok:'Сохранить'});
    if(name){
      const ex=presets.find(x=>x.name===name);
      const data={name,img:clone(settings.img),vid:clone(settings.vid),common:clone(settings.common)};
      if(ex)Object.assign(ex,data);else presets.push({id:pid(),...data});
      savePresets();toast(ex?`Пресет «${name}» обновлён`:`Пресет «${name}» сохранён`,'success');
    }
    openSettings();
  }
  else if(a==='export')exportSettings();
  else if(a==='import')$('#importFile').click();
  else if(a==='reset'){
    closeSheet(null);
    const ok=await askConfirm({title:'Сбросить настройки?',text:'Вернутся значения по умолчанию. Ваши пресеты и тема останутся.',ok:'Сбросить',danger:true});
    if(ok){
      Object.assign(settings.img,clone(DEFAULTS.img));Object.assign(settings.vid,clone(DEFAULTS.vid));Object.assign(settings.common,clone(DEFAULTS.common));
      Object.assign(settings.app,clone(DEFAULTS.app));
      syncCommon();afterChange();toast('Настройки сброшены','success');
    }
    openSettings();
  }
});
sheet.addEventListener('change',e=>{
  const t=e.target;
  if(sheet._settings&&t.dataset&&t.dataset.s==='autodl'){settings.app.autoDownload=t.checked;saveSettings()}
});
$('#setBtn').innerHTML=I.gear;
$('#setBtn').addEventListener('click',openSettings);
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(f){await importSettings(f);rerenderSettings()}
});

globalForms.forEach(f=>f.sync());
renderAll();
})();
</script>
</body>
</html>
