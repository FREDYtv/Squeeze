<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squeeze — сжатие фото и видео</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#fafafa; --panel:#ffffff; --field:#f4f4f5;
  --text:#18181b; --muted:#71717a; --muted-2:#a1a1aa;
  --line:#e4e4e7; --line-strong:#d4d4d8;
  --accent:#18181b; --accent-text:#ffffff; --accent-hover:#3f3f46;
  --ok:#15803d; --warn:#a16207; --danger:#b91c1c;
  --hover:rgba(24,24,27,.05);
  --r-sm:6px; --r:8px; --r-lg:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  --modal-backdrop:rgba(9,9,11,.85);
}
[data-theme="dark"]{
  --bg:#09090b; --panel:#18181b; --field:#27272a;
  --text:#fafafa; --muted:#a1a1aa; --muted-2:#71717a;
  --line:#27272a; --line-strong:#3f3f46;
  --accent:#fafafa; --accent-text:#18181b; --accent-hover:#e4e4e7;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --hover:rgba(250,250,250,.06);
  --modal-backdrop:rgba(0,0,0,.9);
}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); -webkit-font-smoothing:antialiased;
  line-height:1.45; padding-bottom:24px;
  transition:background .2s,color .2s;
}
body.has-bar{padding-bottom:96px}
body.modal-open{overflow:hidden;touch-action:none}

.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* ---------- HEADER ---------- */
header{
  position:sticky; top:0; z-index:60;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(150%) blur(10px);
  -webkit-backdrop-filter:saturate(150%) blur(10px);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:28px;height:28px;border:1px solid var(--text);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;
}
.brand-name{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-1px}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s,border-color .15s;flex:none;padding:0;
}
.icon-btn:hover{background:var(--hover);border-color:var(--line-strong)}
.icon-btn:active{transform:scale(.97)}

/* ---------- INTRO ---------- */
.intro{padding:22px 0 4px}
.intro h1{font-size:clamp(19px,3vw,24px);margin:0 0 6px;letter-spacing:-.02em;font-weight:600}
.intro p{margin:0;color:var(--muted);font-size:13.5px}

/* ---------- DROP ---------- */
.drop{
  margin-top:16px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);
  background:var(--panel);padding:36px 20px;text-align:center;
  transition:border-color .15s,background .15s;cursor:pointer;
}
.drop:hover{border-color:var(--text)}
.drop.drag{border-color:var(--text);background:var(--field)}
.drop-icon{
  width:40px;height:40px;border:1px solid var(--line-strong);border-radius:var(--r);
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
}
.drop-title{font-weight:600;font-size:15px}
.drop-sub{color:var(--muted);font-size:12.5px;margin:4px 0 16px}
.drop.has-files{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;border-style:solid;border-color:var(--line)}
.drop.has-files .drop-icon{width:34px;height:34px;border-radius:var(--r-sm);margin:0;flex:none}
.drop.has-files .drop-icon svg{width:16px;height:16px}
.drop.has-files .drop-title{font-size:13.5px;margin:0}
.drop.has-files .drop-sub{display:none}
.drop.has-files .btn{margin-left:auto;flex:none}

/* ---------- BUTTONS ---------- */
.btn{
  font-family:inherit;font-size:13.5px;font-weight:500;
  border:1px solid transparent;border-radius:var(--r-sm);
  padding:9px 16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
  line-height:1.2;min-height:36px;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover);border-color:var(--line-strong)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:var(--r-sm);min-height:32px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- GLOBALS ---------- */
.globals-trigger{
  display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);font-family:inherit;font-size:13.5px;font-weight:500;
  color:var(--text);cursor:pointer;transition:border-color .15s;text-align:left;flex-wrap:wrap;
}
.globals-trigger:hover{border-color:var(--line-strong)}
.globals-trigger .hint{font-weight:400;font-size:12px;color:var(--muted);margin-left:2px}
.globals-trigger .chev{margin-left:auto;transition:transform .2s;flex:none;color:var(--muted)}
.globals-trigger.open .chev{transform:rotate(180deg)}
.globals-trigger.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.globals-body{
  background:var(--panel);border:1px solid var(--line);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:2px 14px 14px;
}
.global-group{margin-top:12px}
.global-group:first-child{margin-top:6px}
.global-group + .global-group{border-top:1px solid var(--line);padding-top:12px}
.group-title{
  font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:8px;
}

/* ---------- PRESETS / FIELDS ---------- */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.preset{
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s;font-family:inherit;
  display:flex;flex-direction:column;gap:1px;min-width:0;
}
.preset:hover{border-color:var(--line-strong);background:var(--hover)}
.preset.active{border-color:var(--text);background:var(--panel)}
.preset-label{font-weight:600;font-size:13px;color:var(--text);line-height:1.25}
.preset.active .preset-label{color:var(--text)}
.preset-desc{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.target-row{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  padding:8px 10px;background:var(--field);border-radius:var(--r-sm);flex-wrap:wrap;
}
.target-row .check{flex:1;background:transparent;border:none;padding:0;min-width:0}
.target-input{
  width:72px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--panel);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;
  text-align:center;font-variant-numeric:tabular-nums;transition:border-color .15s;
}
.target-input:disabled{opacity:.4;cursor:not-allowed}
.target-input:focus{outline:none;border-color:var(--text)}
.target-unit{font-size:12px;color:var(--muted);font-weight:500}

.settings-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
  padding:12px;background:var(--field);border-radius:var(--r-sm);
}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;transition:opacity .2s}
.field-label{font-size:12px;color:var(--muted);font-weight:500}
.field-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.field-val{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.field-hint{font-weight:400;color:var(--muted);font-size:11px}
.field-disabled{opacity:.4}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;
  background:transparent;cursor:pointer;margin:0;display:block;
}
input[type=range]:disabled{cursor:not-allowed}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:99px;background:var(--line-strong);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--text);margin-top:-6.5px;border:none;transition:transform .12s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--line-strong)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--text)}

/* ---------- SELECT ---------- */
.select{position:relative;width:100%}
.select-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font-family:inherit;font-size:13px;font-weight:500;
  color:var(--text);cursor:pointer;text-align:left;transition:border-color .15s;
}
.select-btn:hover{border-color:var(--line-strong)}
.select.open .select-btn{border-color:var(--text)}
.select-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select-caret{display:flex;color:var(--muted);transition:transform .2s;flex:none}
.select.open .select-caret{transform:rotate(180deg)}
.select-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:120;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:4px;max-height:240px;overflow:auto;display:none;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.select.open .select-menu{display:block}
.select.up .select-menu{top:auto;bottom:calc(100% + 4px)}
.select-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:8px 9px;border:none;background:transparent;border-radius:4px;
  font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left;
}
.select-item:hover{background:var(--hover)}
.select-item .tick{opacity:0;color:var(--text);flex:none}
.select-item.active{background:var(--field);font-weight:600}
.select-item.active .tick{opacity:1}

/* ---------- CHECKBOX ---------- */
.check{
  display:flex;align-items:center;gap:9px;cursor:pointer;padding:9px 11px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);
  font-size:13px;font-weight:500;position:relative;
  align-self:end;transition:border-color .15s;user-select:none;
}
.check:hover{border-color:var(--line-strong)}
.check input{position:absolute;opacity:0;pointer-events:none}
.check-box{
  width:16px;height:16px;border-radius:4px;border:1.4px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;flex:none;transition:border-color .15s,background .15s;
}
.check-box::after{
  content:"";width:8px;height:4px;border-left:2px solid var(--accent-text);
  border-bottom:2px solid var(--accent-text);
  transform:rotate(-45deg) scale(0);transition:transform .15s;margin-top:-2px;
}
.check input:checked + .check-box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .check-box::after{transform:rotate(-45deg) scale(1)}

/* ---------- CARDS ---------- */
.files{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  transition:border-color .15s;
}
.card.open{border-color:var(--line-strong)}
.card.processing{border-color:var(--text)}
.card-head{
  display:flex;align-items:center;gap:12px;padding:11px 12px;
  cursor:pointer;user-select:none;
}
.card.processing .card-head{cursor:default}
.thumb{
  width:52px;height:52px;border-radius:var(--r-sm);overflow:hidden;background:var(--field);
  flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--muted);position:relative;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0;overflow:hidden}
.name{
  font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:6px;
}
.name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-dot{
  width:5px;height:5px;border-radius:50%;background:var(--text);flex:none;
}
.meta-row{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  margin-top:5px;min-height:18px;
}
.chip{
  display:inline-flex;align-items:center;gap:3px;padding:1px 6px;
  border-radius:4px;font-size:11px;font-weight:500;
  background:var(--field);color:var(--muted);
  white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5;
}
.chip.type-image,.chip.type-video{background:var(--field);color:var(--muted)}

.head-right{display:flex;align-items:center;gap:4px;flex:none}
.chev svg{transition:transform .2s}
.card.open .chev svg{transform:rotate(180deg)}
.card-body{display:none;padding:0 12px 12px}
.card.open .card-body{display:block}

/* ---------- PREVIEW ---------- */
.preview-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:10px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--field);flex-wrap:wrap;
}
.preview-row.warn{background:var(--field)}
.preview-label{
  font-size:11.5px;color:var(--muted);font-weight:500;
  display:flex;align-items:center;gap:4px;flex:none;
}
.preview-value{
  font-size:13px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap;min-width:0;
}
.preview-value .sz-from{color:var(--muted);font-weight:500}
.preview-value .sz-arrow{color:var(--muted);opacity:.6;font-weight:400}
.preview-value .sz-to{color:var(--text);font-weight:600}
.preview-pct{
  font-size:11px;font-weight:600;padding:1px 5px;border-radius:3px;
  background:var(--panel);color:var(--ok);border:1px solid var(--line);
}
.preview-pct.up{color:var(--warn)}
.preview-loading{opacity:.6;font-weight:400;font-size:12px;color:var(--muted)}

/* ---------- CARD STATUS ---------- */
.card-foot{
  display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;
}
.card-status{
  margin-top:10px;padding:10px 12px;background:var(--field);border-radius:var(--r-sm);
}
.status-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;font-weight:500;flex-wrap:wrap;
}
.status-row .ok{color:var(--ok);font-variant-numeric:tabular-nums;font-weight:600}
.status-row .warn{color:var(--warn);font-variant-numeric:tabular-nums;font-weight:600}
.status-row .err{color:var(--danger);font-weight:500}
.status-row .sz-from{color:var(--muted);font-weight:500}
.status-row .sz-arrow{color:var(--muted);opacity:.6;font-weight:400;margin:0 1px}
.status-actions{display:flex;gap:5px;flex-wrap:wrap}
.bar{
  height:3px;border-radius:99px;background:var(--line-strong);
  overflow:hidden;margin-top:8px;
}
.bar-fill{
  height:100%;width:0;background:var(--text);border-radius:99px;
  transition:width .2s linear;
}
.thumb-done{
  position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;
  background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;
}

/* ---------- ACTION BAR ---------- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  border-top:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(150%) blur(10px);
  -webkit-backdrop-filter:saturate(150%) blur(10px);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));
}
.actionbar-inner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.ab-info{
  font-size:12.5px;color:var(--muted);font-weight:500;
  font-variant-numeric:tabular-nums;
}
.ab-info b{color:var(--text);font-weight:600}
.ab-info .sz-from{color:var(--muted);font-weight:500}
.ab-info .sz-arrow{color:var(--muted);opacity:.6;margin:0 1px}
.ab-btns{display:flex;gap:6px;margin-left:auto}

/* ---------- TOASTS ---------- */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:300;
  display:flex;flex-direction:column;gap:6px;align-items:center;
  pointer-events:none;width:calc(100% - 24px);max-width:420px;
}
body.has-bar #toasts{bottom:88px}
.toast{
  pointer-events:auto;background:var(--text);color:var(--bg);
  padding:10px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;
  max-width:100%;text-align:center;line-height:1.4;
  transition:opacity .25s,transform .25s;
}
.toast.out{opacity:0;transform:translateY(8px)}
.toast.error{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.toast .sz-from{opacity:.75}
.toast .sz-arrow{opacity:.55;margin:0 2px}

/* ---------- COMPARE MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:var(--modal-backdrop);
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  touch-action:none;
}
.modal-overlay[hidden]{display:none}
.compare-modal{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:960px;height:85vh;max-height:760px;overflow:hidden;
  display:flex;flex-direction:column;
}
.compare-header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);flex:none;
}
.compare-title{
  font-weight:600;font-size:14px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.compare-close{width:34px;height:34px}
.compare-content{
  flex:1;display:flex;overflow:hidden;min-height:0;
  background:#0a0a0a;position:relative;touch-action:none;
}
.compare-footer{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;border-top:1px solid var(--line);flex:none;
  flex-wrap:wrap;background:var(--panel);
}
.compare-info{
  font-size:12.5px;color:var(--muted);font-weight:500;flex:1;min-width:0;
  font-variant-numeric:tabular-nums;
}
.compare-info b{color:var(--text);font-weight:600}
.compare-actions{display:flex;gap:6px;flex:none}

/* ---------- IMAGE COMPARE ---------- */
.slider-wrapper{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:14px;overflow:hidden;touch-action:none;
}
.slider-inner{
  position:relative;display:inline-block;line-height:0;
  max-width:100%;max-height:100%;border-radius:var(--r);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;outline:none;
}
.slider-inner:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.img-orig,.img-comp{
  display:block;max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;pointer-events:none;-webkit-user-drag:none;
}
.img-comp{position:absolute;top:0;left:0;width:100%;height:100%;clip-path:inset(0 0 0 50%)}
.slider-line{
  position:absolute;top:0;bottom:0;left:50%;width:2px;
  background:#fff;transform:translateX(-50%);pointer-events:none;z-index:5;
}
.slider-handle{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;background:#fff;border-radius:50%;
  z-index:10;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.slider-inner.dragging .slider-handle{transform:translate(-50%,-50%) scale(1.08)}

.badge{
  position:absolute;top:12px;
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:4px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:#fff;z-index:8;pointer-events:none;
  background:rgba(15,15,15,.72);line-height:1;

<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

function fmtBytes(b){
  if(!b && b !== 0) return '—';
  if(b === 0) return '0 Б';
  const u=['Б','КБ','МБ','ГБ']; let i=0,n=b;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (i===0 ? Math.round(n) : (n<10 ? n.toFixed(1) : Math.round(n))) + ' ' + u[i];
}
function fmtTime(s){
  if(!isFinite(s) || s<=0) return '';
  const m=Math.floor(s/60), sec=Math.round(s%60);
  return m ? m+':'+String(sec).padStart(2,'0') : '0:'+String(sec).padStart(2,'0');
}
function plural(n,a,b,c){
  const m=n%100,k=n%10;
  if(m>10 && m<20) return c;
  if(k===1) return a;
  if(k>=2 && k<=4) return b;
  return c;
}
const TYPE_MAP={'image/jpeg':'JPEG','image/png':'PNG','image/webp':'WebP','image/gif':'GIF',
  'image/avif':'AVIF','image/bmp':'BMP','image/svg+xml':'SVG','video/mp4':'MP4','video/webm':'WebM',
  'video/quicktime':'MOV','video/x-matroska':'MKV','video/ogg':'OGG'};
function fmtType(mime,name){
  if(TYPE_MAP[mime]) return TYPE_MAP[mime];
  const ext=(name.split('.').pop()||'').toUpperCase();
  return ext.length<=5 ? ext : 'Файл';
}

function toast(msg, type){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.innerHTML = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),280); }, 3200);
}

/* ===================== CUSTOM SELECT ===================== */
let openSelect=null;
function closeSelects(){ if(openSelect){ openSelect.classList.remove('open'); openSelect=null; } }
document.addEventListener('click', closeSelects);
window.addEventListener('resize', closeSelects);

function createSelect(options, value, onChange){
  const wrap=document.createElement('div'); wrap.className='select';
  const btn=document.createElement('button'); btn.type='button'; btn.className='select-btn';
  const lab=document.createElement('span'); lab.className='select-label';
  const car=document.createElement('span'); car.className='select-caret';
  car.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  btn.append(lab,car);
  const menu=document.createElement('div'); menu.className='select-menu';
  let current=value;

  const items=options.map(o=>{
    const it=document.createElement('button');
    it.type='button'; it.className='select-item'; it.dataset.value=o.value;
    it.innerHTML='<span>'+o.label+'</span><svg class="tick" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    it.addEventListener('click', e=>{
      e.stopPropagation();
      current=o.value;
      sync();
      closeSelects();
      onChange(o.value);
    });
    return it;
  });
  menu.append(...items);

  function sync(){
    const cur=options.find(o=>String(o.value)===String(current)) || options[0];
    lab.textContent=cur.label;
    items.forEach(it=>it.classList.toggle('active', it.dataset.value===String(current)));
  }
  sync();

  btn.addEventListener('click', e=>{
    e.stopPropagation();
    if(wrap.classList.contains('open')){ closeSelects(); return; }
    closeSelects();
    const r=btn.getBoundingClientRect();
    wrap.classList.toggle('up', window.innerHeight-r.bottom < 240 && r.top > 240);
    wrap.classList.add('open');
    openSelect=wrap;
  });

  wrap.append(btn, menu);
  return wrap;
}

function rangeField(label, min, max, step, value, onChange, suffix, hintFn){
  suffix=suffix||'';
  const wrap=document.createElement('div'); wrap.className='field';
  const top=document.createElement('div'); top.className='field-top';
  const l=document.createElement('span'); l.className='field-label'; l.textContent=label;
  const v=document.createElement('span'); v.className='field-val';
  const updateVal = (val) => {
    const hint = hintFn ? hintFn(val) : '';
    v.innerHTML = val + suffix + (hint ? ' <span class="field-hint">· '+hint+'</span>' : '');
  };
  updateVal(value);
  top.append(l,v);
  const input=document.createElement('input');
  input.type='range'; input.min=min; input.max=max; input.step=step; input.value=value;
  input.addEventListener('input', ()=>{ updateVal(input.value); onChange(Number(input.value)); });
  wrap.append(top,input);
  wrap._input = input;
  return wrap;
}

function selectField(label, options, value, onChange){
  const wrap=document.createElement('div'); wrap.className='field';
  const l=document.createElement('div'); l.className='field-label'; l.textContent=label;
  wrap.append(l, createSelect(options, value, onChange));
  return wrap;
}

function checkField(text, checked, onChange){
  const wrap=document.createElement('label'); wrap.className='check';
  const input=document.createElement('input'); input.type='checkbox'; input.checked=checked;
  const box=document.createElement('span'); box.className='check-box';
  const t=document.createElement('span'); t.textContent=text;
  input.addEventListener('change', ()=>onChange(input.checked));
  wrap.append(input,box,t);
  return wrap;
}

/* ===================== FORMATS ===================== */
const hasMR = typeof MediaRecorder!=='undefined';
const WEBM_OK = (function(){
  if(!hasMR) return false;
  try{ return MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') || MediaRecorder.isTypeSupported('video/webm'); }
  catch(e){ return false; }
})();
const WEBP_IMAGE_OK = (function(){
  try{
    const c=document.createElement('canvas');
    c.width=1; c.height=1;
    return c.toDataURL('image/webp').indexOf('data:image/webp')===0;
  }catch(e){ return false; }
})();
const IMAGE_DEFAULT_FORMAT = WEBP_IMAGE_OK ? 'image/webp' : 'image/jpeg';

function mimeForVideo(){
  try{
    if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) return 'video/webm;codecs=vp9,opus';
    if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) return 'video/webm;codecs=vp8,opus';
    return 'video/webm';
  }catch(e){ return 'video/webm'; }
}

/* ===================== PRESETS ===================== */
const IMAGE_PRESETS = [
  { id:'high',     label:'Высокое',   desc:'WebP 92 · без видимых потерь', quality:92, maxSize:'original', format:'image/webp' },
  { id:'balanced', label:'Баланс',    desc:'WebP 85 · рекомендуется',      quality:85, maxSize:'original', format:'image/webp' },
  { id:'compact',  label:'Компактно', desc:'WebP 75 · до 1920px',          quality:75, maxSize:'1920',     format:'image/webp' },
  { id:'tiny',     label:'Минимум',   desc:'WebP 60 · до 1280px',          quality:60, maxSize:'1280',     format:'image/webp' }
];
const VIDEO_PRESETS = [
  { id:'high',     label:'Высокое',   desc:'Лёгкое сжатие', quality:80, resolution:'original', fps:'original' },
  { id:'balanced', label:'Баланс',    desc:'1080p · хорошо', quality:60, resolution:'1080',     fps:'original' },
  { id:'compact',  label:'Компактно', desc:'720p · средне',  quality:40, resolution:'720',      fps:'30' },
  { id:'tiny',     label:'Минимум',   desc:'480p · экономно', quality:25, resolution:'480',     fps:'24' }
];

function applyPreset(settings, preset, kind){
  settings.preset = preset.id;
  settings.quality = preset.quality;
  if(kind === 'image'){
    settings.maxSize = preset.maxSize;
    settings.format = preset.format;
  } else {
    settings.resolution = preset.resolution;
    settings.fps = preset.fps;
  }
  settings.targetSize = false;
}

/* ===================== STATE ===================== */
const state = {
  files: [],
  gImage: { preset:'balanced', quality:85, maxSize:'original', format: IMAGE_DEFAULT_FORMAT, targetSize:false, targetMB:2 },
  gVideo: { preset:'balanced', quality:60, resolution:'1080', fps:'original', audio:true, targetSize:false, targetMB:10 }
};
(function loadSettings(){
  try{
    const gi = JSON.parse(localStorage.getItem('sqz-gImage'));
    if(gi && typeof gi==='object') Object.assign(state.gImage, gi);
    const gv = JSON.parse(localStorage.getItem('sqz-gVideo'));
    if(gv && typeof gv==='object') Object.assign(state.gVideo, gv);
  }catch(e){}
})();
function saveSettings(){
  try{
    localStorage.setItem('sqz-gImage', JSON.stringify(state.gImage));
    localStorage.setItem('sqz-gVideo', JSON.stringify(state.gVideo));
  }catch(e){}
}

/* ===================== BITRATE MATH ===================== */
function calcVideoBitrate(w, h, fps, quality){
  const q = Math.max(0.05, Math.min(1, quality/100));
  const bpp = 0.010 + Math.pow(q, 1.7) * 0.19;
  const rawBps = w * h * fps * bpp;
  const floorBps = w * h * fps * 0.020;
  return Math.round(Math.max(rawBps, floorBps, 80000));
}

function getVideoTarget(item){
  if(!item.duration || item.duration <= 0) return null;
  const s = item.settings;
  let vw = item.width || 1920, vh = item.height || 1080;
  if(s.resolution !== 'original'){
    const max = parseInt(s.resolution, 10);
    const k = Math.min(1, max / Math.max(vw, vh));
    vw = Math.max(2, Math.round(vw * k / 2) * 2);
    vh = Math.max(2, Math.round(vh * k / 2) * 2);
  }
  const fps = s.fps === 'original' ? 30 : parseInt(s.fps, 10);

  if(s.targetSize){
    const targetBytes = (s.targetMB || 10) * 1024 * 1024;
    const totalBps = (targetBytes * 8) / item.duration;
    const audioBps = s.audio ? 128000 : 0;
    const vBitrate = Math.max(80000, Math.round(totalBps - audioBps));
    return { bitrate: Math.min(vBitrate, 15000000), vw, vh, fps, mode:'target' };
  }

  const origBitrate = (item.size * 8) / item.duration;
  let vBitrate = calcVideoBitrate(vw, vh, fps, s.quality);
  vBitrate = Math.min(vBitrate, Math.round(origBitrate * 0.85));
  return { bitrate: Math.max(80000, vBitrate), vw, vh, fps, mode:'quality', origBitrate };
}

function estimateVideoSize(item){
  if(!item.duration || item.duration <= 0) return 0;
  const t = getVideoTarget(item);
  if(!t) return item.size;
  const audioBps = item.settings.audio ? 128000 : 0;
  const totalBps = t.bitrate + audioBps;
  return Math.round(totalBps * item.duration / 8 * 1.06);
}

/* ===================== IMAGE EFFECTIVE PARAMS ===================== */
function getEffectiveImageParams(quality, format, origW, origH, baseScale){
  const q = Math.max(0.05, Math.min(1, quality / 100));
  const origLong = Math.max(origW, origH);
  const isSmall = origLong < 1000;
  let scale = baseScale || 1.0;

  if (q < 0.60) {
    let qualityScale;
    if (isSmall) {
      qualityScale = 0.72 + q * 0.48;
    } else {
      qualityScale = 0.32 + q * 1.13;
    }
    scale = Math.min(scale, qualityScale);
  }

  const MIN_LONG = 280;
  if (origLong * scale < MIN_LONG && origLong > MIN_LONG) {
    scale = MIN_LONG / origLong;
  }

  let encoderQuality;
  if (format === 'image/png') {
    encoderQuality = 1.0;
  } else if (format === 'image/webp') {
    encoderQuality = 0.42 + q * 0.50;
  } else {
    encoderQuality = 0.52 + q * 0.43;
  }

  const needSharpen = format !== 'image/png' && (scale < 0.78 || encoderQuality < 0.58);

  return { scale: Math.min(1, scale), encoderQuality, needSharpen };
}

/* ===================== SHARPEN (luma-only, area-capped) ===================== */
function applySharpen(canvas, amount){
  try {
    const w = canvas.width, h = canvas.height;
    if (w * h > 3500000) return;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.getImageData(0, 0, w, h);
    const src = imgData.data;
    const dst = new Uint8ClampedArray(src.length);
    const amt = amount;
    const stride = w * 4;

    for (let y = 0; y < h; y++) {
      const rowStart = y * stride;
      const hasUp = y > 0, hasDown = y < h - 1;
      for (let x = 0; x < w; x++) {
        const idx = rowStart + x * 4;
        const hasLeft = x > 0, hasRight = x < w - 1;
        const r = src[idx], g = src[idx+1], b = src[idx+2];
        const lum = 0.299*r + 0.587*g + 0.114*b;

        const rU = hasUp    ? src[idx - stride]     : r;
        const gU = hasUp    ? src[idx - stride + 1] : g;
        const bU = hasUp    ? src[idx - stride + 2] : b;
        const rD = hasDown  ? src[idx + stride]     : r;
        const gD = hasDown  ? src[idx + stride + 1] : g;
        const bD = hasDown  ? src[idx + stride + 2] : b;
        const rL = hasLeft  ? src[idx - 4]          : r;
        const gL = hasLeft  ? src[idx - 4 + 1]      : g;
        const bL = hasLeft  ? src[idx - 4 + 2]      : b;
        const rR = hasRight ? src[idx + 4]          : r;
        const gR = hasRight ? src[idx + 4 + 1]      : g;
        const bR = hasRight ? src[idx + 4 + 2]      : b;

        const avgL = 0.299*(rU+rD+rL+rR) + 0.587*(gU+gD+gL+gR) + 0.114*(bU+bD+bL+bR);
        const avgL4 = avgL * 0.25;
        const delta = (lum - avgL4) * amt;

        let nr = r + delta, ng = g + delta, nb = b + delta;
        if (nr < 0) nr = 0; else if (nr > 255) nr = 255;
        if (ng < 0) ng = 0; else if (ng > 255) ng = 255;
        if (nb < 0) nb = 0; else if (nb > 255) nb = 255;

        dst[idx] = nr; dst[idx+1] = ng; dst[idx+2] = nb;
        dst[idx+3] = src[idx+3];
      }
    }
    ctx.putImageData(new ImageData(dst, w, h), 0, 0);
  } catch(e) {}
}

function sharpenAmountFor(scale, encoderQuality){
  let a = 0.12;
  if (scale < 0.7) a += (0.7 - scale) * 0.85;
  if (encoderQuality < 0.55) a += (0.55 - encoderQuality) * 0.85;
  return Math.min(a, 0.55);
}

    btn.addEventListener('click', e => {
      e.stopPropagation();
      applyPreset(settings, p, kind);

    });

      {value:'image/jpeg',label:'JPEG · универсальный'},
      {value:'image/png',label:'PNG · без потерь'}
    ], settings.format, v => { settings.format=v; settings.preset=null; update(); saveSettings(); }));
  } else {
    const qField = rangeField('Качество', 10, 100, 1, settings.quality,
      v => { settings.quality = v; settings.preset = null; update(); saveSettings(); },

    fields.appendChild(qField);

    fields.appendChild(selectField('Разрешение', [

function qHintImg(q){
  if (q >= 90) return 'макс';
  if (q >= 75) return 'отлично';
  if (q >= 60) return 'хорошо';
  if (q >= 40) return 'средне';
  if (q >= 20) return 'компактно';
  return 'макс. сжатие';
}
function qHintVid(q){
  if (q >= 80) return 'высокое';
  if (q >= 60) return 'хорошее';
  if (q >= 40) return 'среднее';
  if (q >= 25) return 'экономно';
  return 'низкое';
}

/* ===================== GLOBALS ===================== */
let globalsDebounce = {};
function applyGlobalsDebounced(kind){
  clearTimeout(globalsDebounce[kind]);
  globalsDebounce[kind] = setTimeout(() => applyGlobals(kind), 100);
}
function applyGlobals(kind){
  state.files.forEach(item => {
    if(item.kind !== kind || item.custom || item.status === 'processing') return;
    Object.assign(item.settings, kind==='image'?state.gImage:state.gVideo);
    if(item.status === 'done'){ item.status='idle'; item.result=null; item.progress=0; }
    if(item.width){ buildSettings(item); refreshPreview(item); }
    updateCard(item);
  });
  updateActionBar();
}

/* ===================== PROBING ===================== */
function loadImageFallback(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('Не удалось загрузить изображение'));
    img.src = url;
  });
}

async function createBitmapFromFile(file){
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch(e) {
    try { return await createImageBitmap(file); } catch(e2) { return null; }
  }
}

async function probeImage(item){
  let source;
  try {
    source = await createBitmapFromFile(item.file);
    if (!source) throw new Error('bitmap fail');
  } catch(e) {
    source = await loadImageFallback(item.url);
  }
  item.width = source.width; item.height = source.height;
  try{
    const c=document.createElement('canvas');
    const k=96/Math.max(source.width,source.height);
    c.width=Math.max(1,Math.round(source.width*k));
    c.height=Math.max(1,Math.round(source.height*k));
    c.getContext('2d').drawImage(source,0,0,c.width,c.height);
    item.thumb=c.toDataURL('image/jpeg',0.72);
  }catch(e){}
  if(source.close) try{ source.close(); }catch(e){}
}

function probeVideo(item){
  return new Promise((resolve,reject)=>{
    const v=document.createElement('video');
    v.preload='metadata'; v.muted=true; v.playsInline=true;
    v.setAttribute('playsinline','');
    let settled=false;
    const done=()=>{ if(settled) return; settled=true; resolve(); };

    v.addEventListener('loadedmetadata', ()=>{
      item.width=v.videoWidth; item.height=v.videoHeight; item.duration=v.duration;
      try{ v.currentTime=Math.min(0.1, (v.duration||1)/2); }catch(e){ done(); }
      v.addEventListener('seeked', ()=>{
        try{
          const c=document.createElement('canvas');
          const k=96/Math.max(v.videoWidth||1,v.videoHeight||1);
          c.width=Math.max(1,Math.round(v.videoWidth*k));
          c.height=Math.max(1,Math.round(v.videoHeight*k));
          c.getContext('2d').drawImage(v,0,0,c.width,c.height);
          item.thumb=c.toDataURL('image/jpeg',0.72);
        }catch(e){}
        done();
      }, {once:true});
      setTimeout(done, 1600);
    });
    v.addEventListener('error', ()=> reject(new Error('Не удалось прочитать видео')));
    v.src=item.url;
  });
}

/* ===================== ADD FILES ===================== */
async function addFiles(list){
  const arr=Array.from(list);
  const valid=arr.filter(f=> f.type.startsWith('image/') || f.type.startsWith('video/'));
  if(!valid.length){ toast('Поддерживаются только фото и видео', 'error'); return; }
  if(arr.length-valid.length) toast('Пропущено файлов: '+(arr.length-valid.length), 'error');

  for(const file of valid){
    const isImage = file.type.startsWith('image/');
    const item = {
      id: uid(), file, name: file.name, size: file.size,
      kind: isImage ? 'image' : 'video',
      url: URL.createObjectURL(file),
      settings: Object.assign({}, isImage ? state.gImage : state.gVideo),
      custom:false, status:'idle', progress:0, result:null, cancelRequested:false,
      width:0, height:0, duration:0, thumb:'',
      _preview:null, _previewTimer:null, _previewRunning:false, _previewKey:'',
      _previewQueuedKey:null,
      _videoEl: null
    };
    state.files.push(item);
    renderCard(item);
    updateCard(item);

    try{
      if(isImage) await probeImage(item);
      else await probeVideo(item);
      buildSettings(item);
      updateCard(item);
      refreshPreview(item);
      if(state.files.length === 1) item.el.classList.add('open');
    }catch(e){
      item.status='error';
      item.error = e.message || 'Не удалось прочитать файл';
      updateCard(item);
    }
  }

  updateGlobals();
  updateActionBar();
  toast(valid.length+' '+plural(valid.length,'файл добавлен','файла добавлено','файлов добавлено'), 'ok');
}

/* ===================== PREVIEW ===================== */
function settingsKey(item){
  const s = item.settings;
  if(item.kind === 'image') return [s.quality, s.maxSize, s.format, s.targetSize, s.targetMB].join('|');
  return [s.quality, s.resolution, s.fps, s.audio, s.targetSize, s.targetMB].join('|');
}

function refreshPreview(item){
  if(!item.width || item.status === 'processing') return;
  const key = settingsKey(item);
  if(item._previewKey === key && item._preview) { updatePreviewUI(item); return; }
  item._previewKey = key;

  if(item.kind === 'video'){
    const est = estimateVideoSize(item);
    item._preview = est ? { size: est, isEstimate: true } : null;
    updatePreviewUI(item);
    return;
  }

  item._preview = null;
  updatePreviewUI(item, true);
  clearTimeout(item._previewTimer);
  item._previewTimer = setTimeout(() => runPreviewCompress(item, key), 400);
}

async function runPreviewCompress(item, key){
  if(item._previewRunning){
    item._previewQueuedKey = key;
    return;
  }
  item._previewRunning = true;
  try{
    const res = await compressImage(item, true);
    if(item._previewKey === key){
      item._preview = { size: res.blob.size, isEstimate: false };
    }
  }catch(e){
    if(item._previewKey === key) item._preview = null;
  }
  item._previewRunning = false;

  if(item._previewKey === key) {
    updatePreviewUI(item);
  } else {
    const queued = item._previewQueuedKey;
    item._previewQueuedKey = null;
    if(queued){
      runPreviewCompress(item, queued);
    } else {
      refreshPreview(item);
    }
  }
}

function updatePreviewUI(item, loading){
  const row = item.el && item.el.querySelector('.preview-row');
  if(!row) return;
  const pv = item._preview;

  if(loading){
    row.hidden = false;
    row.classList.remove('warn');
    row.innerHTML = '<span class="preview-label">Результат</span>'+
      '<span class="preview-value preview-loading">Расчёт…</span>';
    return;
  }
  if(!pv || !pv.size){ row.hidden = true; return; }

  row.hidden = false;
  const delta = item.size - pv.size;
  const pct = Math.round(delta / item.size * 100);
  const noGain = pct <= 2;
  row.classList.toggle('warn', noGain);

  const pctHtml = noGain
    ? '<span class="preview-pct up">без выигрыша</span>'
    : '<span class="preview-pct">−'+pct+'%</span>';

  const prefix = pv.isEstimate ? '≈ ' : '';
  row.innerHTML =
    '<span class="preview-label">'+(pv.isEstimate?'≈ результат':'результат')+'</span>'+
    '<span class="preview-value">'+
      prefix +
      '<span class="sz-from">'+fmtBytes(item.size)+'</span>'+
      '<span class="sz-arrow">→</span>'+
      '<span class="sz-to">'+fmtBytes(pv.size)+'</span>'+
      pctHtml +
    '</span>';
}

  });

    if (item.status === 'processing') {

    }

  });

    e.stopPropagation();
    if (item.status === 'processing') {
      requestCancel(item);

    if (item.status === 'processing') return;
    item.custom = false;
    Object.assign(item.settings, item.kind==='image'?state.gImage:state.gVideo);
    if(item.status === 'done'){ item.status='idle'; item.result=null; }

    refreshPreview(item);

function buildStatusHtml(item){
  const r = item.result;
  const before = fmtBytes(item.size);
  const after = fmtBytes(r.blob.size);
  const pct = Math.round((1 - r.blob.size/item.size)*100);

  if(r.isOriginal){
    return '<span class="warn">Оставлен оригинал · сжатие не выигрывает</span>';
  }

  const sizeHtml =
    '<span class="sz-from">'+before+'</span>'+
    '<span class="sz-arrow">→</span>'+
    '<span class="sz-to">'+after+'</span>';

  let cls = 'ok';
  let suffix = '';
  if(item.settings.targetSize){
    suffix = ' · цель ' + item.settings.targetMB + ' МБ';
  } else if(pct > 0){
    suffix = ' · −' + pct + '%';
  } else if(pct < 0){
    suffix = ' · +' + Math.abs(pct) + '%';
    cls = 'warn';
  }

  return '<span class="'+cls+'">'+sizeHtml+suffix+'</span>';
}

function updateCard(item){
  const el = item.el; if(!el) return;

  const img = el.querySelector('.thumb img');
  if(item.thumb){ if(img.getAttribute('src') !== item.thumb) img.src = item.thumb; }
  else img.removeAttribute('src');

  const doneMark = el.querySelector('.thumb-done');
  doneMark.hidden = !(item.status === 'done' && item.result && !item.result.isOriginal);

  el.querySelector('.name-text').textContent = item.name;
  el.querySelector('.name').title = item.name;
  el.querySelector('.custom-dot').hidden = !item.custom;

  const typeChip = el.querySelector('.type-chip');
  if(item.kind === 'image'){ typeChip.textContent='Фото'; typeChip.className='chip type-chip'; }
  else { typeChip.textContent='Видео'; typeChip.className='chip type-chip'; }

  const dimsChip = el.querySelector('.dims-chip');
  if (item.width && item.height) {
    dimsChip.textContent = item.width + '×' + item.height;
    dimsChip.hidden = false;
  } else {
    dimsChip.hidden = true;
  }

  el.querySelector('.size-chip').textContent = fmtBytes(item.size);

  const durChip = el.querySelector('.dur-chip');
  if(item.kind === 'video' && item.duration > 0){
    durChip.textContent = fmtTime(item.duration); durChip.hidden = false;
  } else durChip.hidden = true;

  const isProcessing = item.status === 'processing';
  el.classList.toggle('processing', isProcessing);

  item.btnDel.style.display = isProcessing ? 'none' : '';
  item.btnChev.style.display = isProcessing ? 'none' : '';
  item.btnReset.disabled = isProcessing;

  if (isProcessing) {
    item.btnRun.textContent = item.cancelRequested ? 'Отмена…' : 'Отмена';
    item.btnRun.className = 'btn danger sm run';
    item.btnRun.disabled = item.cancelRequested;
  } else {
    item.btnRun.disabled = false;
    if (item.status === 'done') {
      item.btnRun.textContent = 'Сжать заново';
      item.btnRun.className = 'btn primary sm run';
    } else {
      item.btnRun.textContent = 'Сжать';
      item.btnRun.className = 'btn primary sm run';
    }
  }

  const st = el.querySelector('.card-status');
  if(item.status === 'processing'){
    st.hidden = false;
    st.innerHTML = '<div class="status-row"><span class="status-text">Сжатие… 0%</span></div>'+
                   '<div class="bar"><div class="bar-fill"></div></div>';
    setProgress(item, item.progress||0);
  } else if(item.status === 'done' && item.result){
    st.hidden = false;
    const r = item.result;
    const showCompare = !r.isOriginal;

    st.innerHTML = '<div class="status-row"><span>'+buildStatusHtml(item)+'</span>'+
      '<div class="status-actions">'+
        (showCompare?'<button class="btn ghost sm cmp" type="button">Сравнить</button>':'')+
        '<button class="btn ghost sm dl" type="button">Скачать</button>'+
      '</div></div>';

    st.querySelector('.dl').addEventListener('click', e => { e.stopPropagation(); download(item); });
    const cmpBtn = st.querySelector('.cmp');
    if(cmpBtn) cmpBtn.addEventListener('click', e => { e.stopPropagation(); openCompare(item); });
  } else if(item.status === 'error'){
    st.hidden = false;
    st.innerHTML = '<div class="status-row"><span class="err">'+(item.error||'Ошибка')+'</span></div>';
  } else {
    st.hidden = true; st.innerHTML = '';
  }
}

function setProgress(item, p){
  item.progress = p;
  const st = item.el && item.el.querySelector('.card-status');
  if(!st || item.status !== 'processing') return;
  const txt = st.querySelector('.status-text');
  const bar = st.querySelector('.bar-fill');
  if(txt) txt.textContent = 'Сжатие… ' + Math.round(p*100) + '%';
  if(bar) bar.style.width = (p*100).toFixed(1) + '%';
}

function buildSettings(item){
  const container = item.el.querySelector('.settings-body');
  buildSettingsPanel(container, item.kind, item.settings, () => {
    item.custom = true;
    if(item.status === 'done'){ item.status='idle'; item.result=null; }
    updateCard(item);
    updateActionBar();
    refreshPreview(item);
  });
}

function removeItem(item){
  const i = state.files.indexOf(item);
  if(i > -1) state.files.splice(i,1);
  if(item.el) item.el.remove();
  if(item.url) URL.revokeObjectURL(item.url);
  clearTimeout(item._previewTimer);
  item.el = null;
  updateGlobals();
  updateActionBar();
}

function requestCancel(item) {
  item.cancelRequested = true;
  item.btnRun.disabled = true;
  item.btnRun.textContent = 'Отмена…';
  if (item._videoEl) {
    try { item._videoEl.pause(); } catch(e){}
  }
}

/* ===================== IMAGE COMPRESSION ===================== */
function canvasToBlob(canvas, format, quality){
  return new Promise(res => {
    canvas.toBlob(blob => {
      if(blob && format === 'image/webp' && blob.type !== 'image/webp'){
        canvas.toBlob(b2 => res(b2), 'image/jpeg', quality);
      } else res(blob);
    }, format, quality);
  });
}

function renderDownscaled(source, targetW, targetH, format){
  let curW = source.width, curH = source.height;
  let curCanvas = document.createElement('canvas');
  curCanvas.width = curW; curCanvas.height = curH;
  const cctx = curCanvas.getContext('2d');
  cctx.imageSmoothingEnabled = true; cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(source, 0, 0);

  let safety = 20;
  while((curW > targetW*2 || curH > targetH*2) && safety-- > 0){
    const nextW = Math.max(targetW, Math.round(curW/2));
    const nextH = Math.max(targetH, Math.round(curH/2));
    const next = document.createElement('canvas');
    next.width = nextW; next.height = nextH;
    const ctx = next.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(curCanvas, 0, 0, nextW, nextH);
    curCanvas = next; curW = nextW; curH = nextH;
  }

  const final = document.createElement('canvas');
  final.width = targetW; final.height = targetH;
  const fctx = final.getContext('2d');
  fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high';
  if(format === 'image/jpeg'){ fctx.fillStyle='#fff'; fctx.fillRect(0,0,targetW,targetH); }
  fctx.drawImage(curCanvas, 0, 0, targetW, targetH);
  return final;
}

function pickImageFormat(req){
  if(req === 'image/jpeg') return 'image/jpeg';
  if(req === 'image/png')  return 'image/png';
  if(req === 'image/webp') return WEBP_IMAGE_OK ? 'image/webp' : 'image/jpeg';
  return IMAGE_DEFAULT_FORMAT;
}

async function compressImage(item, previewMode){
  const s = item.settings;
  const reportProgress = previewMode ? null : (p) => setProgress(item, p);
  if(reportProgress) reportProgress(0.05);

  let bmp;
  try {
    bmp = await createBitmapFromFile(item.file);
    if (!bmp) throw new Error('bitmap fail');
  } catch(e) {
    bmp = await loadImageFallback(item.url);
  }
  const ow = bmp.width, oh = bmp.height;
  if(reportProgress) reportProgress(0.15);

  if (item.cancelRequested) { try{bmp.close&&bmp.close();}catch(e){} throw new Error('Отменено'); }

  const format = pickImageFormat(s.format);

  let baseScale = 1.0;
  if (s.maxSize !== 'original') {
    const max = parseInt(s.maxSize, 10);
    baseScale = Math.min(1, max / Math.max(ow, oh));
  }

  let result;
  try {
    if (s.targetSize) {
      const targetBytes = Math.round((s.targetMB||2) * 1024 * 1024);
      const startW = Math.max(1, Math.round(ow * baseScale));
      const startH = Math.max(1, Math.round(oh * baseScale));
      const iters = previewMode ? 3 : 6;
      result = await fitToTargetSmart(bmp, format, targetBytes, startW, startH, ow, oh, item, reportProgress, iters);
    } else {
      const params = getEffectiveImageParams(s.quality, format, ow, oh, baseScale);
      const tw = Math.max(1, Math.round(ow * params.scale));
      const th = Math.max(1, Math.round(oh * params.scale));
      const canvas = renderDownscaled(bmp, tw, th, format);
      if(reportProgress) reportProgress(0.45);

      if (params.needSharpen) {
        const amt = sharpenAmountFor(params.scale, params.encoderQuality);
        if (amt >= 0.1) applySharpen(canvas, amt);
        if(reportProgress) reportProgress(0.6);
      }

      if (item.cancelRequested) throw new Error('Отменено');
      let blob = await canvasToBlob(canvas, format, params.encoderQuality);
      if(reportProgress) reportProgress(0.95);
      if(!blob) throw new Error('Не удалось сжать изображение');
      if (item.cancelRequested) throw new Error('Отменено');

      if (!previewMode && blob.size >= item.size) {
        result = { blob: item.file, width: ow, height: oh, isOriginal: true };
      } else {
        result = { blob, width: tw, height: th };
      }
    }
  } finally {
    if(bmp.close) try{bmp.close();}catch(e){}
  }

  return result;
}

async function fitToTargetSmart(bmp, format, targetBytes, startW, startH, origW, origH, item, reportProgress, maxIters){
  const floor = format === 'image/webp' ? 0.35 : 0.45;
  const startScale = Math.min(startW / origW, startH / origH);
  const scaleMultipliers = [1.0, 0.82, 0.68, 0.55, 0.44, 0.35];

  for (let si = 0; si < scaleMultipliers.length; si++) {
    const mult = scaleMultipliers[si];
    const w = Math.max(1, Math.round(origW * startScale * mult));
    const h = Math.max(1, Math.round(origH * startScale * mult));
    const canvas = renderDownscaled(bmp, w, h, format);

    const effectiveScale = startScale * mult;
    if (format !== 'image/png' && effectiveScale < 0.85) {
      const amt = sharpenAmountFor(effectiveScale, 0.5);
      if (amt >= 0.1) applySharpen(canvas, amt);
    }

    const minBlob = await canvasToBlob(canvas, format, floor);
    if (!minBlob || minBlob.size > targetBytes) continue;

    let lo = floor, hi = 0.95, best = minBlob;
    for (let i = 0; i < maxIters; i++) {
      if (item.cancelRequested) throw new Error('Отменено');
      const mid = (lo + hi) / 2;
      const blob = await canvasToBlob(canvas, format, mid);
      if (blob && blob.size <= targetBytes) { best = blob; lo = mid + 0.01; }
      else hi = mid - 0.01;
      if (lo >= hi) break;
      if (reportProgress) reportProgress(0.55 + (i + 1) / maxIters * 0.35);
    }
    return { blob: best, width: w, height: h };
  }

  const mult = scaleMultipliers[scaleMultipliers.length - 1];
  const w = Math.max(1, Math.round(origW * startScale * mult));
  const h = Math.max(1, Math.round(origH * startScale * mult));
  const canvas = renderDownscaled(bmp, w, h, format);
  const blob = await canvasToBlob(canvas, format, floor);
  return { blob, width: w, height: h };
}

/* ===================== VIDEO COMPRESSION ===================== */
async function compressVideo(item, onProgress){
  if(!hasMR || !WEBM_OK) throw new Error('Браузер не поддерживает запись видео (WebM)');

  const target = getVideoTarget(item);
  if(!target) throw new Error('Не удалось определить параметры видео');

  const estSize = estimateVideoSize(item);
  if(!item.settings.targetSize && estSize >= item.size * 0.98){
    return { blob: item.file, width: item.width, height: item.height, isOriginal: true };
  }

  const { bitrate, vw, vh, fps } = target;

  const video = document.createElement('video');
  video.src = item.url;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.preload = 'auto';
  video.muted = true;
  video.volume = 0;
  item._videoEl = video;

  await new Promise((res, rej) => {
    if(video.readyState >= 2) return res();
    video.addEventListener('loadeddata', res, {once:true});
    video.addEventListener('error', () => rej(new Error('Не удалось открыть видео')), {once:true});
    setTimeout(() => { if(video.readyState >= 1) res(); }, 2500);
  });

  if (item.cancelRequested) throw new Error('Отменено');

  const canvas = document.createElement('canvas');
  canvas.width = vw; canvas.height = vh;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(video, 0, 0, vw, vh);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const stream = canvas.captureStream(fps);

  let ac = null;
  if(item.settings.audio){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        ac = new AC();
        if(ac.state === 'suspended') await ac.resume();
        const src = ac.createMediaElementSource(video);
        const dest = ac.createMediaStreamDestination();
        src.connect(dest);
        dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      }
    }catch(e){ ac = null; }
  }

  const mime = mimeForVideo();
  let rec;
  try{
    rec = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: bitrate,
      audioBitsPerSecond: 128000
    });
  }catch(e){
    if(ac) try{ ac.close(); }catch(_){}
    throw new Error('Не удалось запустить кодирование: '+e.message);
  }

  const chunks = [];
  let recordedAny = false;
  rec.addEventListener('dataavailable', e => {
    if(e.data && e.data.size > 0){ chunks.push(e.data); recordedAny = true; }
  });
  const stopped = new Promise(res => rec.addEventListener('stop', res, {once:true}));

  rec.start(500);
  await new Promise(r => setTimeout(r, 60));

  try{ await video.play(); }
  catch(e){
    try{ rec.stop(); }catch(_){}
    if(ac) try{ ac.close(); }catch(_){}
    throw new Error('Браузер заблокировал воспроизведение');
  }

  let raf = 0, lastP = 0;
  const draw = () => {
    if(video.ended || video.paused || item.cancelRequested) return;
    try{ ctx.drawImage(video, 0, 0, vw, vh); }catch(e){}
    if(video.duration){
      const p = Math.min(0.985, video.currentTime / video.duration);
      if(p - lastP > 0.01){ lastP = p; onProgress(p); }
    }
    raf = requestAnimationFrame(draw);
  };
  draw();

  await new Promise(res => {
    if(video.ended || item.cancelRequested) return res();
    video.addEventListener('ended', res, {once:true});
    const chk = setInterval(() => {
      if(video.ended || item.cancelRequested){ clearInterval(chk); res(); }
    }, 200);
    setTimeout(() => { clearInterval(chk); if(!video.ended){ try{video.pause();}catch(_){} res(); } }, 300000);
  });

  cancelAnimationFrame(raf);
  onProgress(0.99);
  await new Promise(r => setTimeout(r, 150));

  try{ rec.stop(); }catch(e){}
  await stopped;
  await new Promise(r => setTimeout(r, 100));

  if(ac) try{ ac.close(); }catch(e){}
  stream.getTracks().forEach(t => t.stop());
  item._videoEl = null;

  if (item.cancelRequested) throw new Error('Отменено');

  if(!recordedAny || !chunks.length) throw new Error('Не удалось записать видео (0 данных)');

  const blob = new Blob(chunks, { type: mime });
  if(blob.size < 5000) throw new Error('Запись слишком короткая');

  if(!item.settings.targetSize && blob.size >= item.size * 0.98){
    return { blob: item.file, width: item.width, height: item.height, isOriginal: true };
  }

  return { blob, width: vw, height: vh };
}

/* ===================== RUN ===================== */
let running = false;

async function runOne(item){
  if(item.status === 'processing') return;
  item.status = 'processing';
  item.cancelRequested = false;
  item.progress = 0;
  item.result = null;
  updateCard(item);
  updateActionBar();

  try{
    let res;
    if(item.kind === 'image') res = await compressImage(item, false);
    else res = await compressVideo(item, p => setProgress(item, p));

    if (item.cancelRequested) throw new Error('Отменено');

    item.result = res;
    item.status = 'done';
    item.progress = 1;
  }catch(err){
    if (item.cancelRequested) {
      item.status = 'idle';
      item.cancelRequested = false;
      item.progress = 0;
      toast('Сжатие отменено');
    } else {
      console.error(err);
      item.status = 'error';
      item.error = err && err.message ? err.message : 'Ошибка обработки';
      toast('Не удалось: «'+shortName(item.name)+'»', 'error');
    }
  } finally {
    item._videoEl = null;
  }

  updateCard(item);
  updateActionBar();
}

async function runAll(){
  if(running) return;
  const pending = state.files.filter(f => f.status !== 'done' && f.status !== 'processing');
  if(!pending.length){ toast('Все файлы уже сжаты'); return; }

  running = true;
  const runBtn = document.getElementById('runBtn');
  runBtn.disabled = true;

  for(let i = 0; i < pending.length; i++){
    runBtn.textContent = 'Сжатие '+(i+1)+'/'+pending.length;
    await runOne(pending[i]);
  }

  runBtn.disabled = false;
  runBtn.textContent = 'Сжать все';
  running = false;

  const justDone = pending.filter(f => f.status === 'done' && f.result && !f.result.isOriginal);
  if (justDone.length > 0) {
    const beforeBytes = justDone.reduce((a,f) => a + f.size, 0);
    const afterBytes  = justDone.reduce((a,f) => a + f.result.blob.size, 0);
    const pct = Math.round((beforeBytes - afterBytes) / beforeBytes * 100);
    const noun = plural(justDone.length,'файл','файла','файлов');
    toast(
      'Готово: '+justDone.length+' '+noun+' · '+
      '<span class="sz-from">'+fmtBytes(beforeBytes)+'</span>'+
      '<span class="sz-arrow">→</span>'+
      '<span class="sz-to">'+fmtBytes(afterBytes)+'</span>'+
      ' (−'+pct+'%)',
      'ok'
    );
  } else {
    toast('Готово: '+pending.length+' '+plural(pending.length,'файл','файла','файлов'), 'ok');
  }
}

/* ===================== DOWNLOAD ===================== */
function shortName(n){ return n.length > 26 ? n.slice(0,23)+'…' : n; }

function extFor(item){
  if(item.kind === 'image'){
    if(!item.result || !item.result.blob) return 'jpg';
    const bt = item.result.blob.type;
    if(bt === 'image/png') return 'png';
    if(bt === 'image/webp') return 'webp';
    return 'jpg';
  }
  return 'webm';
}

function download(item){
  if(!item.result) return;
  const base = item.name.replace(/\.[^.]+$/,'');
  if(item.result.isOriginal){
    const a = document.createElement('a');
    a.href = item.url; a.download = item.name;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  const url = URL.createObjectURL(item.result.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = base + '-squeezed.' + extFor(item);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function downloadAll(){
  const done = state.files.filter(f => f.status === 'done');
  if(!done.length){ toast('Сначала сожмите файлы', 'error'); return; }
  done.forEach((it,i) => setTimeout(() => download(it), i*350));
  if(done.length > 1) toast('Скачиваем '+done.length+' файлов — разрешите загрузки');
}

/* ===================== COMPARE ===================== */
let compareState = { item:null, cleanup:null, escHandler:null };

function openCompare(item){
  if(!item.result || item.result.isOriginal) return;
  compareState.item = item;
  const modal = document.getElementById('compareModal');
  const content = document.getElementById('compareContent');
  const title = document.getElementById('compareTitle');
  const info = document.getElementById('compareInfo');
  const dlBtn = document.getElementById('compareDl');

  title.textContent = item.name;

  const saved = Math.round((1 - item.result.blob.size/item.size)*100);
  info.innerHTML = '<b>'+fmtBytes(item.size)+'</b> → <b>'+fmtBytes(item.result.blob.size)+'</b>' + (saved > 0 ? ' · <b>−'+saved+'%</b>' : '');

  dlBtn.onclick = () => download(item);

  content.innerHTML = '';
  if(item.kind === 'image') buildImageCompare(content, item);
  else buildVideoCompare(content, item);

  modal.hidden = false;
  document.body.classList.add('modal-open');

  compareState.escHandler = (e) => { if(e.key === 'Escape') closeCompare(); };
  document.addEventListener('keydown', compareState.escHandler);
  document.getElementById('compareClose').focus();
}

function closeCompare(){
  const modal = document.getElementById('compareModal');
  modal.hidden = true;
  document.body.classList.remove('modal-open');
  if(compareState.escHandler) document.removeEventListener('keydown', compareState.escHandler);
  if(compareState.cleanup) try{ compareState.cleanup(); }catch(e){}
  document.getElementById('compareContent').innerHTML = '';
  compareState = { item:null, cleanup:null, escHandler:null };
}

document.getElementById('compareClose').addEventListener('click', closeCompare);
document.getElementById('compareModal').addEventListener('click', e => {
  if(e.target === document.getElementById('compareModal')) closeCompare();
});

function buildImageCompare(container, item){
  const origUrl = item.url;
  const compUrl = URL.createObjectURL(item.result.blob);
  compareState.cleanup = () => { try{ URL.revokeObjectURL(compUrl); }catch(e){} };

  const wrapper = document.createElement('div');
  wrapper.className = 'slider-wrapper';

  const inner = document.createElement('div');
  inner.className = 'slider-inner';
  inner.tabIndex = 0;
  inner.setAttribute('role', 'slider');
  inner.setAttribute('aria-valuemin', '0');
  inner.setAttribute('aria-valuemax', '100');
  inner.setAttribute('aria-valuenow', '50');
  inner.setAttribute('aria-label', 'Сравнение: перетаскивайте, стрелки, двойной клик — сброс');

  const imgOrig = new Image();
  imgOrig.className = 'img-orig';
  imgOrig.src = origUrl;

  const imgComp = new Image();
  imgComp.className = 'img-comp';
  imgComp.src = compUrl;

  const line = document.createElement('div');
  line.className = 'slider-line';

  const handle = document.createElement('div');
  handle.className = 'slider-handle';
  handle.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M8 12H4M4 12l4-4M4 12l4 4M16 12h4M20 12l-4-4M20 12l-4 4"/></svg>';

  const bOrig = document.createElement('div');
  bOrig.className = 'badge badge-orig';
  bOrig.textContent = 'До';

  const bComp = document.createElement('div');
  bComp.className = 'badge badge-comp';
  bComp.textContent = 'После';

  inner.append(imgOrig, imgComp, line, handle, bOrig, bComp);
  wrapper.appendChild(inner);
  container.appendChild(wrapper);

  let position = 0.5;

  function setPosition(frac, smooth){
    position = clamp(frac, 0, 1);
    const pct = position * 100;
    imgComp.style.clipPath = 'inset(0 0 0 ' + pct + '%)';
    line.style.left = pct + '%';
    handle.style.left = pct + '%';

    const origOp = clamp((position - 0.05) / 0.15, 0, 1);
    const compOp = clamp((0.95 - position) / 0.15, 0, 1);

    if (smooth) {
      bOrig.style.transition = 'opacity .2s ease, transform .2s ease';
      bComp.style.transition = 'opacity .2s ease, transform .2s ease';
    } else {
      bOrig.style.transition = 'none';
      bComp.style.transition = 'none';
    }

    bOrig.style.opacity = origOp;
    bComp.style.opacity = compOp;
    bOrig.style.transform = 'translateY(' + ((1 - origOp) * -6) + 'px)';
    bComp.style.transform = 'translateY(' + ((1 - compOp) * -6) + 'px)';

    inner.setAttribute('aria-valuenow', Math.round(position * 100));
  }
  setPosition(0.5, false);

  const getX = (ev) => {
    const rect = inner.getBoundingClientRect();
    return (ev.clientX - rect.left) / rect.width;
  };

  let isDragging = false;
  inner.style.cursor = 'ew-resize';

  inner.addEventListener('pointerdown', e => {
    e.preventDefault();
    isDragging = true;
    inner.classList.add('dragging');
    inner.setPointerCapture(e.pointerId);
    setPosition(getX(e), true);
    inner.focus({ preventScroll: true });
  });

  inner.addEventListener('pointermove', e => {
    if (!isDragging) return;
    e.preventDefault();
    setPosition(getX(e), false);
  });

  const stopDrag = (e) => {
    if (!isDragging) return;
    isDragging = false;
    inner.classList.remove('dragging');
    try { inner.releasePointerCapture(e.pointerId); } catch(_) {}
  };
  inner.addEventListener('pointerup', stopDrag);
  inner.addEventListener('pointercancel', stopDrag);

  inner.addEventListener('dblclick', e => {
    e.preventDefault();
    setPosition(0.5, true);
  });

  inner.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const step = e.shiftKey ? 0.10 : 0.02;
      setPosition(position + (e.key === 'ArrowRight' ? step : -step), true);
    } else if (e.key === 'Home') {
      e.preventDefault();
      setPosition(0, true);
    } else if (e.key === 'End') {
      e.preventDefault();
      setPosition(1, true);
    }
  });
}

function buildVideoCompare(container, item){
  const origUrl = item.url;
  const compUrl = URL.createObjectURL(item.result.blob);
  compareState.cleanup = () => { try{ URL.revokeObjectURL(compUrl); }catch(e){} };

  const wrapper = document.createElement('div');
  wrapper.className = 'video-wrapper';

  const video = document.createElement('video');
  video.controls = true;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.src = origUrl;

  const tabs = document.createElement('div');
  tabs.className = 'video-tabs';

  const tabOrig = document.createElement('button');
  tabOrig.type = 'button';
  tabOrig.className = 'video-tab active';
  tabOrig.textContent = 'До';

  const tabComp = document.createElement('button');
  tabComp.type = 'button';
  tabComp.className = 'video-tab';
  tabComp.textContent = 'После';

  tabs.append(tabOrig, tabComp);
  wrapper.append(video, tabs);
  container.appendChild(wrapper);

  let current = 'orig';
  let switchId = 0;

  function switchTo(target){
    if(target === current) return;
    const myId = ++switchId;
    const wasPlaying = !video.paused;
    const time = video.currentTime;
    current = target;

    tabOrig.classList.toggle('active', target === 'orig');
    tabComp.classList.toggle('active', target === 'comp');

    video.src = target === 'orig' ? origUrl : compUrl;
    video.load();

    const onLoaded = () => {
      video.removeEventListener('loadedmetadata', onLoaded);
      if(myId !== switchId) return;
      try{ video.currentTime = time; }catch(e){}
      if(wasPlaying) video.play().catch(()=>{});
    };
    video.addEventListener('loadedmetadata', onLoaded);
  }

  tabOrig.addEventListener('click', () => switchTo('orig'));
  tabComp.addEventListener('click', () => switchTo('comp'));
}

/* ===================== UI ===================== */
function buildGlobalPanels(){
  buildSettingsPanel(document.getElementById('gImageBody'), 'image', state.gImage, () => applyGlobalsDebounced('image'));
  buildSettingsPanel(document.getElementById('gVideoBody'), 'video', state.gVideo, () => applyGlobalsDebounced('video'));
}

function updateGlobals(){
  const hasFiles = state.files.length > 0;
  const hasImg = state.files.some(f => f.kind === 'image');
  const hasVid = state.files.some(f => f.kind === 'video');
  document.getElementById('globalsWrap').hidden = !hasFiles;
  document.getElementById('gImageGroup').hidden = !hasImg;
  document.getElementById('gVideoGroup').hidden = !hasVid;
  if(hasFiles) buildGlobalPanels();
  document.getElementById('dropTitle').textContent =
    hasFiles ? 'Добавить ещё файлы' : 'Перетащите файлы или выберите';
}

function updateActionBar(){
  const n = state.files.length;
  const bar = document.getElementById('actionbar');

  const shouldShow = n > 1;
  bar.hidden = !shouldShow;
  document.body.classList.toggle('has-bar', shouldShow);

  document.getElementById('drop').classList.toggle('has-files', n > 0);

  if(n === 0) return;

  const total = state.files.reduce((a,f) => a + f.size, 0);
  let html = n + ' ' + plural(n,'файл','файла','файлов') + ' · <b>' + fmtBytes(total) + '</b>';

  const done = state.files.filter(f => f.status === 'done' && f.result && !f.result.isOriginal);
  if (done.length > 0) {
    const beforeBytes = done.reduce((a,f) => a + f.size, 0);
    const afterBytes  = done.reduce((a,f) => a + f.result.blob.size, 0);
    const pct = Math.round((beforeBytes - afterBytes) / beforeBytes * 100);
    html += ' · сжато ' +
      '<span class="sz-from">'+fmtBytes(beforeBytes)+'</span>' +
      '<span class="sz-arrow">→</span>' +
      '<b>'+fmtBytes(afterBytes)+'</b> (−'+pct+'%)';
  }

  document.getElementById('abInfo').innerHTML = html;

  const doneAll = state.files.filter(f => f.status === 'done').length;
  document.getElementById('dlBtn').hidden = doneAll === 0;
  document.getElementById('dlBtn').textContent = doneAll > 1 ? 'Скачать все ('+doneAll+')' : 'Скачать';
}

/* ===================== THEME ===================== */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('sqz-theme', t); }catch(e){}
  document.getElementById('themeIcon').innerHTML = t === 'dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
(function initTheme(){
  let t='light';
  try{ t = localStorage.getItem('sqz-theme') || ''; }catch(e){}
  if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(t);
})();
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

/* ===================== LOAD ===================== */
const drop = document.getElementById('drop');
const input = document.getElementById('fileInput');
document.getElementById('pickBtn').addEventListener('click', e => { e.stopPropagation(); input.click(); });
drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); input.click(); } });
input.addEventListener('change', () => { if(input.files && input.files.length) addFiles(input.files); input.value=''; });
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* ===================== GLOBALS TOGGLE ===================== */
const gt = document.getElementById('globalsTrigger');
const gb = document.getElementById('globalsBody');
gt.addEventListener('click', () => {
  const open = gb.hidden;
  gb.hidden = !open;
  gt.classList.toggle('open', open);
});

/* ===================== BUTTONS ===================== */
document.getElementById('runBtn').addEventListener('click', runAll);
document.getElementById('dlBtn').addEventListener('click', downloadAll);
document.getElementById('clearBtn').addEventListener('click', () => {
  const processing = state.files.some(f => f.status === 'processing');
  if (processing) {
    toast('Дождитесь окончания или отмените сжатие', 'error');
    return;
  }
  if(!state.files.length) return;
  state.files.forEach(f => { if(f.url) URL.revokeObjectURL(f.url); clearTimeout(f._previewTimer); });
  state.files = [];
  document.getElementById('files').innerHTML = '';
  updateGlobals();
  updateActionBar();
  toast('Список очищен');
});

updateGlobals();
updateActionBar();

})();
</script>
</body>
</html>
